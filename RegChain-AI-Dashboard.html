let replaying = false;
let drawerOrigin = null;
const selectedChange = () => changes.find(change=>change.id===currentChange);
const filteredStudies = () => studyView === "portfolio" ? studies.filter(study=>study.changes.includes(currentChange)) : publicStudies.filter(study=>study.countries.includes(selectedChange().scope));
const retryCount = sources.filter(source=>source.status==="Retry needed").length;

function shell() {
  byId("brand-mark").innerHTML=icon("logo");
  byId("mode").innerHTML=icon("clock")+" Historical replay";
  byId("crumb").innerHTML='Clinical Supply '+icon("chevron")+' <strong>'+navItems[page]+'</strong>';
  byId("nav").innerHTML=Object.entries(navItems).map(([id,name])=>'<button type="button" class="nav" data-act="nav" data-value="'+id+'"'+(page===id?' aria-current="page"':'')+'>'+icon(id)+name+'</button>').join("");
}
function heading(title,description,action="") {
  return '<header class="page-head"><div><h1 id="page-title" tabindex="-1">'+title+'</h1><p>'+description+'</p></div>'+action+'</header>';
}
function updateRun() {
  const button=byId("replay");
  if (button) {
    button.disabled=replaying;
    button.innerHTML=icon("retry")+(replaying?"Replaying…":"Replay checks");
  }
}
function overview() {
  return heading("Regulatory monitor","See what was checked, what changed, and which studies need review.",'<button id="replay" class="btn primary" type="button" data-act="replay">'+icon("retry")+'Replay checks</button>')+
    '<div class="runbar"><div class="runbar-left">'+icon("clock")+'<strong>Replay '+String(replayCount).padStart(2,"0")+'</strong><span class="separator">·</span><span>'+replayDate+' · times in UTC</span></div>'+badge("Completed with 1 retry needed","amber")+'</div>'+
    '<div class="tiles" aria-label="Replay summary">'+
      tile("Pages checked",sources.length,"3 changed · 2 unchanged · 1 retry","sources","sources")+
      tile("Changes detected",changes.length,"3 published-source examples","changes","changes")+
      tile("Studies to review",studies.filter(study=>study.status==="Batch review").length,"UK labeling · fictional portfolio","studies","studies")+
      tile("Checks to retry",retryCount,"Approved-country list","alert","retry-filter")+
    '</div><div class="layout">'+sourceCard(true)+changeCard(true)+'</div><div class="space" id="study-card">'+studyCard(true)+'</div>';
}
function tile(title,value,hint,symbol,target) {
  return '<button type="button" class="tile" data-act="metric" data-value="'+target+'"><div class="tile-top"><span class="tile-icon">'+icon(symbol)+'</span>'+title+'</div><strong>'+value+'</strong><small>'+hint+'</small></button>';
}
function sourceTable(data,compact) {
  if (!data.length) return '<p class="nothing">No pages match these filters.</p>';
  const rows=data.map(source=>'<tr><td><button class="entity-button" type="button" data-act="source-detail" data-value="'+source.id+'">'+icon("file")+'<span>'+source.title+'<small class="sub">'+source.authority+' · '+(compact?source.scope:source.path)+'</small></span></button></td><td class="nowrap muted">'+source.checked+'</td><td>'+badge(source.status,source.tone)+'</td>'+(!compact?'<td class="hide-narrow">'+source.scope+'</td><td class="hide-narrow">'+source.type+'</td>':'')+'</tr>').join("");
  return '<div class="table-wrap" tabindex="0"><table><caption class="sr">Source pages checked in the replay</caption><thead><tr><th>Page checked</th><th>UTC</th><th>Check status</th>'+(!compact?'<th class="hide-narrow">Scope</th><th class="hide-narrow">Source type</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function tableMatches(source) {
  const matchStatus=sourceFilter==="all"||source.status===sourceFilter;
  const haystack=[source.title,source.authority,source.scope,source.path,source.section].join(" ").toLowerCase();
  return matchStatus&&haystack.includes(sourceSearch.trim().toLowerCase());
}
function sourceCard(compact) {
  const filters=compact?quiet("View source log","sources"):'<div class="filters"><label class="field">Find a page<input id="source-search" type="search" placeholder="Page or authority" value="'+esc(sourceSearch)+'"></label><label class="field">Check status<select id="source-filter"><option value="all">All statuses</option>'+["Changed","Unchanged","Retry needed"].map(status=>'<option'+(status===sourceFilter?' selected':'')+'>'+status+'</option>').join("")+'</select></label></div>';
  return '<section class="card" aria-labelledby="sources-title"><div class="card-head"><div><h2 id="sources-title">Pages checked</h2><p>Latest replay attempts by source page</p></div>'+filters+'</div><div id="source-results">'+sourceTable(compact?sources:sources.filter(tableMatches),compact)+'</div></section>';
}
function changeCard(compact) {
  const entries=changes.map(change=>'<button type="button" class="change" data-act="'+(compact?"select-change":"change-detail")+'" data-value="'+change.id+'"'+(compact?' aria-pressed="'+(currentChange===change.id)+'"':'')+'><span class="change-mark">'+icon("changes")+'</span><span><span class="change-top"><strong>'+change.title+'</strong>'+badge(change.status,change.tone)+'</span><small>'+change.scope+' · '+change.kind+' · '+change.when+'</small><span class="change-summary">'+change.summary+'</span></span>'+icon("chevron")+'</button>').join("");
  return '<section class="card"><div class="card-head"><div><h2>Detected changes</h2><p>'+(compact?"Select a change to see its study screen.":"Historical source changes used in this replay.")+'</p></div>'+(compact?quiet("View queue","changes"):"")+'</div><div class="change-list">'+entries+'</div>'+(compact?'<div class="card-foot">'+trigger("View change evidence","change-detail",currentChange,"","file")+'</div>':'')+'</section>';
}
function studyCard(compact) {
  const change=selectedChange();
  const selected=filteredStudies();
  const registry=studyView==="registry";
  const name=registry?"Public registry matches":"Portfolio impact";
  const tabs='<div class="study-tabs" aria-label="Study dataset"><button type="button" data-act="study-view" data-value="portfolio" aria-pressed="'+!registry+'">Demo portfolio</button><button type="button" data-act="study-view" data-value="registry" aria-pressed="'+registry+'">Public registry</button></div>';
  const content=selected.length?'<div class="table-wrap" tabindex="0"><table><caption class="sr">'+name+'</caption><thead><tr><th>Study</th><th>Listed location</th><th>'+ (registry?"Screening result":"Assessment") +'</th><th class="hide-narrow">'+(registry?"Registry status":"Reason")+'</th></tr></thead><tbody>'+selected.map(study=>'<tr><td><button type="button" class="entity-button" data-act="study-detail" data-value="'+study.id+'"><span>'+esc(study.title)+'<small class="sub">'+study.id+' · '+study.sponsor+'</small></span></button></td><td>'+study.sites+'</td><td>'+badge(registry?"Candidate match":study.status,registry?"blue":study.tone)+'</td><td class="hide-narrow muted">'+(registry?study.status+' · '+study.posted:study.reason)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="nothing">No fictional portfolio assessment is loaded for this change. Open Public registry to see candidates.</p>';
  const note=registry?"Country matches help prioritize screening. Supply impact requires sponsor data.":change.studyNote;
  return '<section class="card"><div class="card-head study-head"><div><h2>Study impact</h2><p>'+change.title+'</p></div>'+tabs+'</div>'+content+'<div class="inline-note">'+icon("info")+'<span>'+note+'</span></div><div class="card-foot"><small>'+ (registry?registryCredit:"Synthetic study and supply records") +'</small>'+(compact?quiet("Open study workspace","studies"):"")+'</div></section>';
}
function resourceCard(name,text,url,linkName) {
  return '<article class="card resource"><h2>'+esc(name)+'</h2><p>'+esc(text)+'</p><div>'+openLink(linkName,url)+'</div></article>';
}
function research() {
  return heading("Data & use cases","Source-backed examples and public study datasets for screening.")+
    '<div class="resource-grid">'+resources.map(item=>resourceCard(item.name,item.text,item.url,"Open data source")).join("")+'</div>'+
    '<h2 class="research-lead">Regulatory use cases</h2>'+changeCard(false)+
    '<div class="space">'+resourceCard("EU Annex VI immediate packaging","Assess whether an eligible inner package can omit the expiry or retest date. The decision depends on the internal packaging configuration and applicable conditions.",sources.find(source=>source.id==="annex").url,"Open EUR-Lex")+'</div>';
}
const views = {
  overview,
  sources:()=>heading("Pages checked","Inspect each page, its retrieval result, the section compared and the linked evidence.")+sourceCard(false),
  changes:()=>heading("Detected changes","Inspect a change, its source evidence and the inputs needed for study screening.")+changeCard(false),
  studies:()=>heading("Study impact","Explore the portfolio assessment or public matches for the selected change.")+
    '<div class="runbar"><label class="field">Regulatory change<select id="study-change">'+changes.map(change=>'<option value="'+change.id+'"'+(change.id===currentChange?' selected':'')+'>'+change.title+'</option>').join("")+'</select></label><div class="actions">'+trigger("View change evidence","change-detail",currentChange,"","file")+(currentChange==="uk"?'<a class="btn" href="./RegChain-AI-Prototype.html">Open approval demo '+icon("arrow")+'</a>':"")+'</div></div><div id="study-card">'+studyCard(false)+'</div>',
  research
};
function render() {shell();byId("view").innerHTML=views[page]();updateRun();}
function notify(text="") {byId("announce").textContent=text;}
function navigate(to,focus=true) {page=to;render();if(focus){byId("page-title").focus({preventScroll:true});window.scrollTo(0,0);}}
function factlist(facts) {
  return '<dl class="facts">'+facts.map(([label,value])=>'<div><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>').join("")+'</dl>';
}
function block(title,text) {return '<section class="drawer-block"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p></section>';}
function drawer(type,title,content) {
  const modal=byId("drawer");
  if (!modal.open) drawerOrigin=document.activeElement;
  byId("drawer-type").textContent=type;
  byId("drawer-title").textContent=title;
  byId("drawer-body").innerHTML=content;
  if (!modal.open) modal.showModal();
  modal.scrollTop=0;
  modal.querySelector(".close").focus();
}
function sourceDetail(id) {
  const source=sources.find(item=>item.id===id);
  drawer("Source check",source.title,badge(source.status,source.tone)+factlist([
    ["Authority",source.authority],["Scope",source.scope],["Check time",replayDate+" · "+source.checked+" UTC (replay)"],
    ["Source edition",source.edition],["Compared section",source.status==="Retry needed"?"Comparison pending":source.section]
  ])+block("Check result",source.result)+'<section><h3>Page URL</h3><a class="url" href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">'+esc(source.url)+'</a></section>'+
  (source.change?'<div>'+trigger("View related change","change-detail",source.change,"","arrow")+'</div>':""));
}
function changeDetail(id) {
  const change=changes.find(item=>item.id===id);
  drawer("Detected change",change.title,badge(change.status,change.tone)+factlist([["Authority",change.authority],["Scope",change.scope],["Date basis",change.when]])+
    block("Previous reference",change.before)+block("What changed",change.after)+block("Study data needed",change.need)+
    '<section><h3>Supporting sources</h3><div class="actions">'+change.evidence.map(id=>trigger(sources.find(source=>source.id===id).title,"source-detail",id,"","file")).join("")+'</div></section>'+
    '<div>'+trigger("View study impact","go-impact",id,"primary","arrow")+'</div>');
}
function studyDetail(id) {
  const isPublic=id.startsWith("NCT");
  const study=(isPublic?publicStudies:studies).find(item=>item.id===id);
  const change=selectedChange();
  if(isPublic) {
    drawer("ClinicalTrials.gov · public registry",study.title,badge("Candidate match","blue")+factlist([["Registry ID",study.id],["Sponsor",study.sponsor],["Listed locations",study.sites],["Registry status",study.status],["Last update posted",study.posted]])+
      block("Why it surfaced","The sample record lists a site in the jurisdiction screened for "+change.title+".")+
      block("Information needed to assess impact",change.need)+'<p>'+esc(registryCredit)+'</p><div>'+openLink("Open registry record",study.url,"primary")+'</div>');
  } else {
    drawer("Fictional portfolio",study.title,badge(study.status,study.tone)+factlist([["Study ID",study.id],["Location",study.sites],["Related change",change.title],["Batches",study.batches.join(", ")]])+
      block("Assessment",study.detail)+'<div>'+trigger("View change evidence","change-detail",change.id,"","file")+'</div>');
  }
}
function selectChange(id) {
  currentChange=id;
  studyView=studies.some(study=>study.changes.includes(id))?"portfolio":"registry";
}
function updateStudies() {byId("study-card").innerHTML=studyCard(page==="overview");}
function replay() {
  if (replaying) return;
  replaying=true;updateRun();notify("Replaying the six recorded checks.");
  window.setTimeout(()=>{
    replayCount++;replaying=false;
    if(page==="overview"){render();byId("replay").focus();}
    notify("Replay complete. Three changes detected. One source check needs retry.");
  },350);
}
const actions={
  nav:to=>{notify();navigate(to);},
  metric:target=>{
    if(target==="retry-filter"){sourceFilter="Retry needed";sourceSearch="";navigate("sources");return;}
    if(target==="sources"){sourceFilter="all";sourceSearch="";}
    if(target==="studies") selectChange("uk");
    navigate(target);
  },
  replay,
  "source-detail":sourceDetail,
  "change-detail":changeDetail,
  "study-detail":studyDetail,
  "select-change":id=>{
    selectChange(id);
    byId("view").querySelectorAll('[data-act="select-change"]').forEach(control=>control.setAttribute("aria-pressed",String(control.dataset.value===id)));
    byId("view").querySelector('[data-act="change-detail"]').dataset.value=id;
    updateStudies();
    byId("study-card").scrollIntoView({block:"nearest"});
    notify("Study impact updated for "+selectedChange().title+".");
  },
  "go-impact":id=>{byId("drawer").close();drawerOrigin=null;selectChange(id);navigate("studies");},
  "study-view":tab=>{studyView=tab;updateStudies();byId("study-card").querySelector('[data-value="'+tab+'"]').focus();notify(tab==="registry"?"Showing public registry candidates.":"Showing the fictional portfolio assessment.");}
};
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-act]");
  if(target && !target.disabled) actions[target.dataset.act](target.dataset.value);
});
document.addEventListener("input",event=>{
  if(event.target.id==="source-search"){
    sourceSearch=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches),false);
  }
});
document.addEventListener("change",event=>{
  if(event.target.id==="source-filter"){
    sourceFilter=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches),false);
  }
  if(event.target.id==="study-change"){
    selectChange(event.target.value);
    render();
    byId("study-change").focus();
  }
});
byId("drawer").addEventListener("close",()=>{if(drawerOrigin?.isConnected) drawerOrigin.focus();drawerOrigin=null;});
render();
</script>
</body>
</html>
