async function runFirstCheck() {

  setFirstRun("checking");
  firstSteps=firstStepNames.map(name=>({name,state:"todo",lines:[]}));
  render();
  notify("The first check is running.");
  const step=async (index,work)=>{
    firstSteps[index].state="active";paintFirst();
    try {await work(firstSteps[index]);} catch(error) {firstSteps[index].lines.push("Could not finish this step: "+error.message);}
    firstSteps[index].state="done";paintFirst();
    await pause(500);
  };
  await step(0,async current=>{
    const replays=serverMode()?Promise.all(["uk-labelling","es-notice"].map(set=>apiWrite("POST","/v1/replays",{fixture_set:set,extraction_mode:"recorded"}).catch(error=>({error:error.message})))):Promise.resolve([]);
    for(let index=1;index<=sources.length;index++) {current.lines=[index+" of "+sources.length+" sources read"];paintFirst();await pause(160);}
    const [uk,es]=await replays;
    current.lines=[sources.length+" of "+sources.length+" sources read and compared · 3 changes found"];
    current.lines.push(uk&&!uk.error?"UK: regulation 46 changed (a "+String(uk.comparison_status).replace("_"," ")+"), "+uk.evidence.filter(item=>item.found).length+" evidence passages found word for word in the official text":"UK: the stored official text was used");
    current.lines.push(es&&!es.error?"Spain: a new information note, "+es.evidence.filter(item=>item.found).length+" evidence passages found word for word":"Spain: the new information note");
    if(israel) current.lines.push("Israel: a new Ministry of Health notice on shared booklet labels (illustrative scenario)");

  await step(1,async current=>{

    current.lines.push("UK labeling: "+uk.trials+" of "+studies.length+" trials and "+uk.batches+" batches need action; the first shipment must be prepared by "+displayDay(uk.first?.preparationDate));
    paintFirst();await pause(450);
    if(israel) {const pool=israelLabelPool();current.lines.push("Israel: the shared booklet splits. "+pool.sharedKits+" kits stay with Greece and Cyprus; Israel has "+pool.israelOnlyKits+" Israel-only kits for the "+pool.needed+" it needs");paintFirst();await pause(450);}
    if(spain) {const {affected,all}=spainImpact();current.lines.push("Spain: "+affected.length+" of "+all.length+" shipments need the new delivery note and pharmacy notice");}
  });
  await step(2,async current=>{
    const all=plannedShipments();
    const count=result=>all.filter(item=>item.result===result).length;
    current.lines.push(all.length+" shipments re-checked: "+count("Blocked")+" blocked, "+count("Confirm")+" to confirm before dispatch, "+count("Ready")+" ready to ship");
    const first=all.find(item=>item.result==="Blocked");
    if(first) current.lines.push("Most urgent: "+first.id+" to "+first.site+", prepare by "+displayDay(first.prepareBy));
  });
  await step(3,async current=>{
    const needs=plannedShipments().filter(needsAction).length;
    current.lines.push("The master agent ranks the "+needs+" shipments and starts the specialists on each one");
    await pause(600);
  });
  setFirstRun("done");
  if(agentServer()&&!portfolioState.running) {
    teamSource="portfolio";
    teamData={...teamData,key:null};
    teamAutoplay=!firstLive;
    page="team";
    startPortfolioRun(firstLive?"live":"scripted");
    byId("page-title")?.focus({preventScroll:true});
    window.scrollTo(0,0);
  } else render();
  notify("The first check is done. The agents are planning every shipment that needs action.");
}

function addMonths(day,months) {

const caseForCountry = countryId => Object.values(governedCases).find(item=>item.country===countryId);
// A case's edits for one section: what was published, or what is proposed now.
function sectionEdits(caseId,sectionId) {
  const state=workflows[caseId];
  return (state.publication?.sectionEdits??governedCases[caseId].edits(state)).filter(edit=>edit.section===sectionId);

// The specification as it stands now: approving a case publishes a new version between scheduled updates.
function specFor(countryId) {
  const spec=countrySpecs[countryId];

  const governed=caseForCountry(countryId);
  const publication=governed&&workflows[governed.key].publication;
  return {...spec,version:publication?spec.version+1:spec.version,published:publication?publication.at.slice(0,10):spec.published,betweenUpdates:Boolean(publication),previousVersion:spec.version,caseId:governed?.id};
}
// One section's current text, owner and check dates.
function specSection(countryId,sectionId) {
  const section=countrySpecs[countryId]?.sections[sectionId];
  if(!section) return null;
  const state=section.case&&workflows[section.case];
  const edits=state?.publication?sectionEdits(section.case,sectionId):[];
  if(edits.length) {
    const on=state.publication.at.slice(0,10);
    return {...section,items:applyEdits(section.items,edits),previousItems:section.items,
      checked:on,checkedBy:(state.decision?.actor??"Regulatory SME")+", approved in "+governedCases[section.case].id,review:addMonths(on,3)};
  }

    return {label:rejected?"Edit rejected":"Edit suggested",tone:"red",key:"edit",change:governed.key,caseId:governed.id,
      note:why+(rejected?"The suggested edit was rejected in case "+governed.id+". The rule still applies, so reopen the case or record why the current text is right.":"RegChain drafted an edit from "+(governed.key==="uk"?"the official sources":"the note")+". It is waiting for approval in case "+governed.id+".")};

// Results: Pass, Confirm (check before dispatch), and three that block dispatch: Fail, Missing data, Expert decision.
// "Not checked" marks a requirement whose data is not connected yet; it never blocks.
const shipmentActionsKey = "regchain-shipment-actions-v1";
let shipmentActions = location.protocol.startsWith("http")?{}:storedJson(shipmentActionsKey);
let manualShipmentActions = {};
let shipmentFilter = "all";

const weekdayName = day => ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(day+"T00:00:00Z").getUTCDay()];
const isWeekend = day => [0,6].includes(new Date(day+"T00:00:00Z").getUTCDay());
const shipmentActionNames = {hold:"On hold",swap:"Batch swap requested",proceed:"Proceeding as planned",plan:"Agent plan approved",escalated:"Escalated"};
// Where a requirement comes from: the specification in force, or a change that is still waiting for approval.
function requirementBasis(countryId,section,caseId) {
  const spec=specFor(countryId);
  const where=specCountryName(countryId)+" specification v"+spec.version+" · "+specSectionNames[section];
  if(!caseId || workflows[caseId].publication) return {basis:where,pending:false};
  return {basis:"Pending change "+governedCases[caseId].id+" · "+specSectionNames[section]+". Specification v"+spec.version+" does not say this yet.",pending:true};
}
function check(countryId,section,requirement,result,detail,caseId) {
  return {section,requirement,result,detail,...requirementBasis(countryId,section,caseId)};
}
// A requirement whose data is not connected yet.
function notChecked(countryId,section,requirement,why) {
  return {section,requirement,result:"Not checked",detail:why,basis:specFor(countryId)?specCountryName(countryId)+" specification · "+specSectionNames[section]:"No specification",pending:false};
}
function preparationCheck(countryId,prepareBy,basisNote) {
  const days=daysFrom(prepareBy);
  const result=days<0?"Fail":days===0||isWeekend(prepareBy)?"Confirm":"Pass";
  const detail=days<0?"The preparation date, "+displayDay(prepareBy)+", has passed.":days===0?"Prepare today, "+displayDay(prepareBy)+".":
    isWeekend(prepareBy)?"Prepare by "+weekdayName(prepareBy)+" "+displayDay(prepareBy)+"; move it to the working day before.":"Prepare by "+displayDay(prepareBy)+", in "+days+" days.";
  return {section:"logistics",requirement:basisNote,result,detail,basis:"Supply plan and "+specCountryName(countryId)+" specification · Logistics constraints",pending:false};
}

function israelLabelPool() {

function startAgentRun(mode) {
  if(agentState.running||portfolioState.running) return;

// The plan for one shipment, read top to bottom: where it stands, why it is blocked, what to approve, what happens next.
function agentView() {

    {label:"Approved in RegChain",sub:approval?(approval.option==="escalate"?"Escalation acknowledged":"By "+approval.by.split(" · ")[0]):"By Clinical Supply",state:approval?"done":record?"active":"todo"},
    {label:"Approved in each system",sub:(()=>{const targets=[...new Set(activeDrafts.map(draft=>draft.target_system==="Depot"?"the depot":draft.target_system))];const list=targets.length>1?targets.slice(0,-1).join(", ")+" and "+targets.at(-1):targets[0]??"each system";return approval&&thisRun?plural(activeDrafts.length,"draft")+" waiting in "+list:"Drafts go to "+list;})(),state:approval&&thisRun?"active":"todo"}
  ]);

  } else if(!record) {
    main='<section class="card plan-hero empty"><div class="plan-eyebrow">No plan yet</div><h2>Let the agents plan this shipment</h2><p>They read IRT, ERP, the depot and the eTMF, propose two or three options, check each one against the rules and draft the changes. Nothing changes until you approve.</p>'+
      runButtons("one","Run the AI agents")+agentSetupNote(status)+'</section>';

    const recommendationFailed=!thisRun&&recommendedId!==chosenId&&recommendedId!=="escalate";

      (recommendationFailed?'<p class="form-feedback">'+escd("The agents recommended \""+(options.find(option=>option.id===recommendedId)?.title??recommendedId)+"\", but RegChain's rules reject it: "+optionReason(verification[recommendedId]))+'</p>':"")+
      (record.resolution.allocation&&chosenId===recommendedId?'<p class="replanned-note">'+esc(record.resolution.allocationShort||record.resolution.allocation)+'</p>':"")+
      '<div class="plan-columns"><div><h3>What changes</h3><ul class="change-list">'+chosen.actions.map(action=>'<li>'+esc(actionSentence(action,shipment))+'</li>').join("")+'</ul></div>'+

  const others=record?otherOptionsCard(record,chosenId,verification,approval,shipment):"";
  const events=agentState.running?agentState.events:(record?.events??[]);
  const trail=(agentState.running||record)?'<details id="agent-trail" class="card fold"'+(openPanels.has("agent-trail")||agentState.running?" open":"")+'><summary><span class="fold-title">'+icon("changes")+'<strong>How the agents worked it out</strong></span><small id="agent-trail-count" class="muted">'+

      (agentState.running?"":'<div class="actions trail-watch">'+trigger("Watch it step by step","watch-team",agentShipment,"quiet","team")+'</div>')+trailFilters(events)+'<ol id="agent-timeline" class="agent-timeline">'+trailList(events)+'</ol></details>':"";
  const runLine=record?'<section class="run-line"><span>'+esc((record.mode==="live"?"AI agents ("+record.models.orchestrator+", "+record.models.specialists+(record.models.service?", through "+record.models.service:"")+")":"Scripted walkthrough, no AI")+" · run on "+scheduleDate(Date.parse(record.at))+
      (record.mode==="live"?" · "+record.usage.input_tokens+" tokens in, "+record.usage.output_tokens+" out":""))+'</span>'+trigger("Export the audit record","agent-export","","quiet","file")+
      '<details id="agent-rerun" class="rerun"'+(openPanels.has("agent-rerun")?" open":"")+'><summary>Run the agents again</summary>'+runButtons("one","Run the AI agents")+agentSetupNote(status)+'<small class="muted">A new run never inherits an earlier approval.</small></details></section>':"";
  return heading(esc(title),esc(sub),back)+steps+
    (agentState.error?'<p class="form-feedback" role="alert">'+esc(agentState.error)+'</p>':"")+
    '<div class="plan-layout">'+problem+main+'</div>'+next+others+trail+controlsPanel("agent-controls",status)+runLine;

// The approve or acknowledge step, or the approval already recorded.

// Every shipment that needs action: the work queue for Clinical Supply.
const plansStatusGroups = {
  action:{label:"To approve",match:status=>["plan","review","escalate"].includes(status)},
  none:{label:"No plan yet",match:status=>status==="none"},
  approved:{label:"Approved",match:status=>["approved","acknowledged"].includes(status)},
  escalate:{label:"Escalations",match:status=>["escalate","acknowledged"].includes(status)},

function planRows() {

const teamSpecialists = ["supply","logistics","records","communications","verifier"];

// A system's answer in one line: how many records, or the main fields, instead of raw JSON.
function teamAnswer(text) {
  let value;
  try {value=JSON.parse(text);} catch {return clip(text,200);}
  const plain=item=>item===null||["string","number","boolean"].includes(typeof item);
  const fields=item=>Object.entries(item).filter(([,field])=>plain(field)).slice(0,4).map(([key,field])=>key.replaceAll("_"," ")+" "+field).join(" · ");
  if(Array.isArray(value)) return !value.length?"Nothing found.":plural(value.length,"record")+": "+value.slice(0,3).map(item=>plain(item)?item:(item.batch??item.id??item.shipment??fields(item))+(item.kits!==undefined?" ("+item.kits+" kits)":"")).join(", ")+(value.length>3?", …":"");
  if(value&&typeof value==="object") return value.error?"Error: "+value.error:fields(value)||"Answered.";
  return String(value);
}

// The last portfolio run with each shipment's own run placed where the master agent handed it out.
async function loadTeamTimeline(source=teamSource) {
  if(!agentServer()) return;
  if(source==="portfolio"&&portfolioState.running) {teamFollowLive();return;}
  teamData={...teamData,key:source,loading:true,error:"",live:false};
  try {
    if(source==="portfolio") {
      const record=await aiRequest("/api/agent/portfolio-last");
      const ids=[...new Set(record.events.filter(event=>event.type==="delegate_shipment").map(event=>event.shipment))];
      const runs=Object.fromEntries(await Promise.all(ids.map(async id=>[id,await aiRequest("/api/agent/last?shipment="+encodeURIComponent(id)).catch(()=>null)])));
      const events=[];
      for(const event of record.events) {
        events.push(event);
        if(event.type==="delegate_shipment"&&runs[event.shipment]) events.push(...runs[event.shipment].events.map(item=>({...item,shipment:event.shipment,nested:true})));
      }
      teamData={key:source,events,record,loading:false,error:"",live:false};
    } else {
      const record=await aiRequest("/api/agent/last?shipment="+encodeURIComponent(source));
      teamData={key:source,events:record.events.map(item=>({...item,shipment:source})),record,loading:false,error:"",live:false};
    }
    teamIndex=teamData.events.length;
    if(teamAutoplay&&teamData.events.length) {teamAutoplay=false;teamIndex=0;teamShown=0;teamSpeed=4;teamPlaying=true;if(page==="team") {render();teamTick();}return;}
  } catch(error) {
    teamData={key:source,events:[],record:null,loading:false,error:error.message.includes("No ")?"":error.message,live:false};
    teamIndex=0;
  }
  if(page==="team") render();
}
function teamFollowLive() {

// Who each step goes from and to, so the board can draw it.
function teamRoute(event) {
  const system=event.system?"sys:"+event.system:null;
  const verify=event.tool==="verify_option";
  switch(event.type) {
    case "delegate": return ["orchestrator",event.to];
    case "tool_call": return verify?[event.agent,"verifier"]:[event.agent,system];
    case "tool_result": return verify?["verifier",event.agent]:[system,event.agent];
    case "report": return [event.agent,"orchestrator"];
    case "draft": return [agentProfiles[event.agent]?event.agent:"orchestrator","sys:Draft inbox"];
    case "verified": case "warning": case "allocation": return ["verifier","orchestrator"];
    default: return [agentProfiles[event.agent]?event.agent:"orchestrator",null];
  }
}
const teamActor = event => event.type==="tool_result"?(event.tool==="verify_option"?"verifier":event.agent):event.type==="tool_call"?event.agent:["verified","warning","allocation"].includes(event.type)?"verifier":agentProfiles[event.agent]?event.agent:"orchestrator";
function teamVerdict(text) {
  try {
    const result=JSON.parse(text);
    return result.passes?"Passes: "+(afterNames[result.after]??result.after)+".":"Does not pass: "+humanDates((result.notes??[]).find(note=>note.startsWith("Not feasible"))?.replace("Not feasible: ","")??"the shipment would still be blocked.");
  } catch {return clip(text,200);}
}
// One step in plain words: what kind of work it is, and the detail.
function teamSentence(event) {
  const name=id=>agentProfiles[id]?.name??id;
  switch(event.type) {
    case "goal": return ["Sets the goal",event.text];
    case "triage": return ["Ranks the work, most urgent first",event.text];
    case "delegate_shipment": return ["Starts the team on "+event.shipment,event.text];
    case "delegate": return ["Hands a task to the "+name(event.to),event.text];
    case "tool_call": return event.tool==="verify_option"?["Asks the RegChain verifier to test an option",(event.input?.actions??[]).map(action=>actionSentence(action)).join(" · ")]:
      event.tool==="create_draft"?["Puts a draft in the Draft inbox",[event.input?.target_system,event.input?.title].filter(Boolean).join(" · ")]:
      ["Reads "+event.system,event.tool.replaceAll("_"," ")+" · "+clip(Object.values(event.input??{}).filter(value=>typeof value!=="object").join(", "),120)];
    case "tool_result": return event.tool==="verify_option"?["The RegChain verifier answers",teamVerdict(event.text)]:event.tool==="create_draft"?["The Draft inbox keeps the draft",teamAnswer(event.text)]:[event.system+" answers",teamAnswer(event.text)];
    case "report": return ["Reports back to the master agent",event.text];
    case "draft": return ["Drafts a change for a person to approve",event.text??event.title??""];
    case "verified": return ["Checks every option against the rules",event.text];
    case "allocation": return ["Checks the plans together",event.text];
    case "warning": return ["Withdraws a recommendation that fails",event.text];
    case "resolution": return ["Recommends",event.text];
    case "shipment_done": return ["Gets the result for "+event.shipment,event.text];
    case "done": return ["Finishes",event.text];
    case "error": return ["Stops",event.text];
    default: return ["Notes",event.text];
  }
}
function teamTally(events) {
  const agents=Object.fromEntries(["orchestrator",...teamSpecialists].map(id=>[id,{tasks:0,calls:0,reports:0,drafts:0,checks:0,teams:0,last:null}]));
  const systems=Object.fromEntries(teamSystems.map(([name])=>[name,0]));
  const shipments=new Set();
  for(const event of events) {
    if(event.shipment) shipments.add(event.shipment);
    const actor=agents[teamActor(event)]??agents.orchestrator;
    if(event.type==="delegate"&&agents[event.to]) agents[event.to].tasks++;
    if(event.type==="delegate_shipment") agents.orchestrator.teams++;
    if(event.type==="tool_call") {
      if(event.tool==="verify_option") agents.verifier.checks++;
      else {agents[event.agent]&&agents[event.agent].calls++;if(event.system in systems) systems[event.system]++;}
    }
    if(event.type==="report") actor.reports++;
    if(event.type==="draft"||(event.type==="tool_call"&&event.tool==="create_draft")) agents.orchestrator.drafts++;
    if(["allocation","warning"].includes(event.type)) agents.verifier.checks++;
    if(event.type!=="tool_result") actor.last=event;
  }
  agents.orchestrator.drafts=Math.max(agents.orchestrator.drafts,0);
  return {agents,systems,shipments};
}

// The line for the current step, drawn between the two cards it connects, with a dot travelling along it.
function teamEdges(route) {

  const svg=byId("team-edges");
  if(!board||!svg) return;

  const center=(id,side)=>{
    const node=board.querySelector('[data-node="'+CSS.escape(id)+'"]');
    if(!node) return null;
    const rect=node.getBoundingClientRect();
    return {x:rect.left-box.left+rect.width/2,y:side==="top"?rect.top-box.top:side==="bottom"?rect.bottom-box.top:rect.top-box.top+rect.height/2};
  };

      replaying=false;
      updateRun();
      notify();
      return;
    }
    const now=Date.now();
    scheduleState.runCount++;
    scheduleState.lastAt=now;
    scheduleState.lastReason=reason;
    if (reason==="scheduled") scheduleState.nextAt=nextCheckAt(scheduleState,now,scheduleState.frequency==="interval"?scheduleState.nextAt:null);
    storeSchedule();
    replaying=false;
    if (page==="overview" || page==="settings") {
      const focused=byId("replay")===document.activeElement;
      if (!byId("schedule-form")?.contains(document.activeElement) || focused) {
        render();
        if(focused) byId("replay").focus();
      } else {
        byId("run-status").innerHTML=runStatus();

    }
    notify("Checks complete. "+changes.length+" changes reviewed. "+(retryCount()===0?"No source check needs a":retryCount()===1?"One source check needs":retryCount()+" source checks need")+" retry.");

    const role=event.target.value;
    const done=()=>{workflowRole=role;render();byId("workflow-role")?.focus();};
    if(serverMode()) apiWrite("POST","/v1/session",{role}).then(done).catch(error=>notify("The role was not changed: "+error.message));
    else done();
  }
  if(event.target.id==="record-as-of") byId("record-as-of-result").textContent=asOfText(event.target.value);
  if(event.target.id==="review-decision") {
    reviewDecision=event.target.value;
    const fields=decisionFields();
    byId("decision-fields").innerHTML=fields;
    byId("decision-fields").hidden=!fields;
    const submit=byId("record-decision");
    submit.value=reviewDecision;
    submit.textContent=reviewDecisions.find(([id])=>id===reviewDecision)[1];
    byId("decision-gate").hidden=!["approve","edit"].includes(reviewDecision);
    submit.disabled=decisionBlocked();
    byId("workflow-error").textContent="";
  }
  if(event.target.id==="ai-override") byId("record-decision").disabled=decisionBlocked();
  if(event.target.id==="shipment-filter" || event.target.id==="shipment-country") {
    if(event.target.id==="shipment-filter") shipmentFilter=event.target.value; else shipmentCountry=event.target.value;
    const id=event.target.id;
    render();
    byId(id).focus();
  }
  if(event.target.id==="source-filter"){
    sourceFilter=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches));
  }
  if (event.target.id==="spec-filter") {
    specFilter=event.target.value;
    byId("country-requirements").innerHTML=countrySpecification();
    byId("spec-filter").focus();
  }
});
document.addEventListener("toggle",event=>{
  const region=event.target.dataset?.region;
  if (!region || !event.target.isConnected) return;
  if(event.target.open) expandedRegions.add(region);
  else expandedRegions.delete(region);
},true);
document.addEventListener("submit",event=>{
  if(event.target.id==="workflow-form"){
    event.preventDefault();
    if(!event.submitter) return;
    const fields=new FormData(event.target);
    const command={action:event.submitter.value,revision:Number(event.target.dataset.revision),
      reason:fields.get("reason"),instruction:fields.get("instruction"),reviewOn:fields.get("reviewOn"),today:libraryToday};
    // A case cannot close while shipments it covers are still blocked with nothing recorded.
    if(command.action==="verify" && unresolvedTaskShipments().length) {byId("workflow-error").textContent="Can't close yet: "+unresolvedTaskShipments().join(", ")+" still blocked with no recorded action.";return;}
    if(["approve","edit"].includes(command.action)) {
      const gate=aiGate();
      if(gate==="fail") {byId("workflow-error").textContent="The latest AI check failed, so approval is blocked. Re-run the AI check, reject, or request an investigation.";return;}
      if(gate==="none" && !fields.get("override")) {byId("workflow-error").textContent="Run the AI check first, or tick the override and give your reason.";return;}
      command.override=gate==="none";
    }
    if(serverMode()) {
      const caseId=isGoverned(currentChange)?currentChange:"uk";
      const submit=event.submitter;
      submit.disabled=true;
      apiWrite("POST","/v1/cases/"+caseId+"/commands",{...command,override:Boolean(command.override)},crypto.randomUUID()).then(reply=>{
        setWorkflow(reply.workflow);
        if(["approve","edit"].includes(command.action)) workflowTab="follow-up";
        if(command.action==="resume") reviewDecision="approve";
        render();
        byId("page-title").focus({preventScroll:true});
        notify("Case updated.");
      }).catch(error=>{submit.disabled=false;if(byId("workflow-error")) byId("workflow-error").textContent=error.message;});
      return;
    }
    const next=structuredClone(readWorkflow(currentChange,workflow));
    try {workflowStep(next,command,workflowRole,new Date().toISOString());}
    catch(error){byId("workflow-error").textContent=error.message;return;}
    setWorkflow(next);
    if(["approve","edit"].includes(command.action)) workflowTab="follow-up";
    if(command.action==="resume") reviewDecision="approve";
    const saved=saveWorkflow(next);
    render();
    byId("page-title").focus({preventScroll:true});
    notify(saved?"Case updated.":"Workflow updated for this tab. Browser storage is unavailable.");
    return;
  }
  if(event.target.id==="shipment-action-form") {
    event.preventDefault();
    const fields=new FormData(event.target);
    const reason=String(fields.get("reason")??"").trim();
    if(!reason) {byId("shipment-action-error").textContent="Give a reason for the action.";return;}
    const id=event.target.dataset.shipment;
    if(serverMode()) {
      apiWrite("PUT","/v1/shipment-actions/"+encodeURIComponent(id),{action:fields.get("action"),reason}).then(reply=>{
        manualShipmentActions={...manualShipmentActions,[id]:{action:reply.action,reason:reply.reason,by:reply.by,at:reply.at}};
        composeShipmentActions();
        if(page==="shipments"||page==="overview") render();
        shipmentDetail(id);
        notify("Action recorded for "+id+".");
      }).catch(error=>{const box=byId("shipment-action-error");if(box) box.textContent=error.message;});
      return;
    }
    shipmentActions={...shipmentActions,[id]:{action:fields.get("action"),reason,by:roleName(workflowRole,workflow),at:new Date().toISOString()}};
    const saved=storeJson(shipmentActionsKey,shipmentActions);
    if(page==="shipments"||page==="overview") render();
    shipmentDetail(id);
    notify(saved?"Action recorded for "+id+".":"Action recorded for this tab. Browser storage is unavailable.");
    return;
  }
  if(event.target.id==="change-decision-form") {
    event.preventDefault();
    const fields=new FormData(event.target);
    const reason=String(fields.get("reason")??"").trim();
    if(!reason) {byId("change-decision-error").textContent="Give a reason for the decision.";return;}
    const id=event.target.dataset.change;
    if(serverMode()) {
      apiWrite("PUT","/v1/change-decisions/"+encodeURIComponent(id),{decision:fields.get("decision"),reason}).then(reply=>{
        changeDecisions={...changeDecisions,[id]:{decision:reply.decision,reason:reply.reason,by:reply.by,at:reply.at}};
        render();
        byId("page-title").focus({preventScroll:true});
        notify("Decision recorded.");
      }).catch(error=>{const box=byId("change-decision-error");if(box) box.textContent=error.message;});
      return;
    }
    changeDecisions={...changeDecisions,[id]:{decision:fields.get("decision"),reason,by:roleName("reviewer",workflow),at:new Date().toISOString()}};
    const saved=storeJson(changeDecisionsKey,changeDecisions);
    render();
    byId("page-title").focus({preventScroll:true});
    notify(saved?"Decision recorded.":"Decision recorded for this tab. Browser storage is unavailable.");
    return;
  }
  if(event.target.id==="connection-request-form") {
    event.preventDefault();
    const fields=new FormData(event.target);
    const request=Object.fromEntries(["name","holds","address","access","owner","reason"].map(name=>[name,String(fields.get(name)??"").trim()]));
    const box=byId("connection-error");
    const missing=!request.name?"Name the system.":!request.owner?"Name the business owner of the system.":!request.holds?"Say what the agents would read there.":"";
    if(missing) {box.textContent=missing;return;}
    agentPost("/api/settings",{section:"connection-request",request}).then(reply=>{
      applySettings(reply);
      openPanels.delete("connection-request");
      render();
      byId("settings-tab-ai")?.focus();
      notify("Connection request recorded for "+request.name+". The Quality owner approves it.");
    }).catch(error=>{const target=byId("connection-error");if(target) target.textContent=error.message;});
    return;
  }
  if(event.target.classList.contains("connection-reject")) {
    event.preventDefault();
    const note=String(new FormData(event.target).get("note")??"").trim();
    if(note.length<3) {event.target.querySelector("input").focus();notify("Say why the request is rejected.");return;}
    decideConnection(event.target.dataset.id,"rejected",note);
    return;
  }
  if(event.target.id!=="schedule-form") return;
  event.preventDefault();
  const fields=event.target.elements;
  const monitoring={enabled:fields.enabled.checked,frequency:fields.frequency.value,weekday:Number(fields.weekday.value),every:Number(fields.every.value),time:fields.time.value,onBlocked:fields.onBlocked.value};
  const problem=byId("schedule-error");
  if(!validMonitoring(monitoring)) {
    problem.textContent=!/^([01]\d|2[0-3]):[0-5]\d$/.test(monitoring.time)?"Give the time as hours and minutes.":"Repeat every 1 to 365 days.";
    return;
  }
  const saved=stored=>{
    render();
    byId("schedule-form")?.querySelector('button[type="submit"]')?.focus();
    notify(!stored?"Schedule applies to this tab. Browser storage is unavailable.":scheduleState.enabled?"Schedule saved. Next check "+checkDate(scheduleState.nextAt)+".":"Schedule saved. Automatic checks are paused.");
    checkDue();
  };
  if(serverMode()) {
    agentPost("/api/settings",{section:"monitoring",monitoring}).then(reply=>{applySettings(reply,true);saved(true);})
      .catch(error=>{const target=byId("schedule-error");if(target) target.textContent=error.message;});
    return;
  }
  scheduleState=readScheduleOrCurrent();
  scheduleState={...scheduleState,...monitoring,nextAt:nextCheckAt(monitoring)};
  saved(storeSchedule());
});
byId("drawer").addEventListener("close",()=>{if(drawerOrigin?.isConnected) drawerOrigin.focus();drawerOrigin=null;});
window.addEventListener("storage",event=>{
  const caseId=Object.keys(governedCases).find(id=>governedCases[id].storageKey===event.key);
  if(!caseId) return;
  if(caseId===currentChange && byId("workflow-form")?.contains(document.activeElement)) {
    notify("Case changed in another tab. Review the latest revision before submitting.");
    return;
  }
  setWorkflow(readWorkflow(caseId));
  if(!byId("drawer").open) render();
});
// ---------- The server's state: session role, cases, shipment actions and change decisions ----------
async function apiWrite(method,path,body,key) {
  return aiRequest(path,{method,headers:{"Content-Type":"application/json",...(key?{"Idempotency-Key":key}:{})},body:body===undefined?undefined:JSON.stringify(body)});
}
// The recorded action of each shipment: what someone recorded by hand, or an approved agent plan.
function composeShipmentActions() {
  if(!serverMode()) return;
  const next={...manualShipmentActions};
  for(const [id,approval] of Object.entries(agentApprovals)) next[id]={action:approval.option==="escalate"?"escalated":"plan",reason:approval.option==="escalate"?"Escalated: no option passes RegChain's rules.":"Agent plan approved: "+approval.title,by:approval.by,at:approval.at};
  shipmentActions=next;
}
async function loadServerState() {
  if(!serverMode()) return;
  try {
    const [session,cases,actions,decisions]=await Promise.all([aiRequest("/v1/session"),aiRequest("/v1/cases"),aiRequest("/v1/shipment-actions"),aiRequest("/v1/change-decisions")]);
    signedInUser=session.mode==="password"?session.user:null;
    serverAuthMode=session.mode;
    if(session.role) workflowRole=session.role;
    else if(session.mode!=="password") await apiWrite("POST","/v1/session",{role:workflowRole});
    for(const item of cases.cases) setWorkflow(item.workflow);
    manualShipmentActions=actions.actions??{};
    changeDecisions=decisions.decisions??{};
    composeShipmentActions();
    render();
  } catch(error) {
    notify("RegChain's server did not answer: "+error.message);
  }
}
render();
loadServerState().then(loadAi);
checkDue();
window.setInterval(checkDue,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkDue();});
</script>
