   if(!["investigating","deferred"].includes(state.stage)) throw Error("There is no held proposal to resume.");

   state.revision++;
   state.stage="review";

   appendWorkflowEvent(state,"proposal.review_resumed",role,now,reason);

   if(!instruction||instruction===state.draft) throw Error("Edit the operational instruction before choosing Edit & approve.");
   state.revision++;

   appendWorkflowEvent(state,"proposal.edited",role,now,instruction);
  }

  return;
 }
 if(action==="implement" && role==="owner" && task.status==="acknowledged") {
  if(!reason) throw Error("Enter the mock implementation evidence reference.");

function runStatus() {
  const next=scheduleState.enabled?scheduleDate(scheduleState.nextAt):"Paused";
  const last=scheduleState.lastAt?scheduleDate(scheduleState.lastAt)+" · "+(scheduleState.lastReason==="scheduled"?"Scheduled replay":"Manual replay"):"Historical sample · "+replayDate;
  return factlist([["Next demo run",next],["Last run",last],["Source coverage",sources.length+" sample checks · "+retryCount+" retry needed"]]);
}

function shell() {
  byId("brand-mark").innerHTML=icon("logo");
  byId("mode").innerHTML=icon("clock")+" Historical replay";
  byId("crumb").innerHTML=page==="case"?'Clinical Supply '+icon("chevron")+" <strong>Change details</strong>":
    'Clinical Supply '+icon("chevron")+' <strong>'+esc(navItems[page])+'</strong>';
  byId("nav").innerHTML=Object.entries(navItems).map(([id,name])=>'<button type="button" class="nav" data-act="nav" data-value="'+id+'"'+(page===id?' aria-current="page"':page==="case"&&id==="overview"?' aria-current="location"':'')+'>'+icon(id)+name+'</button>').join("");
}
function heading(title,description,action="") {
  return '<header class="page-head"><div><h1 id="page-title" tabindex="-1">'+title+'</h1><p>'+description+'</p></div>'+action+'</header>';
}
function updateRun() {
  const button=byId("replay");
  if (button) {
    button.disabled=replaying;
    button.innerHTML=icon("retry")+(replaying?"Replaying…":"Replay checks");
  }
}
function overview() {
  return heading("Regulatory monitor","Open a change to see its evidence, impact and next action.",'<button id="replay" class="btn primary" type="button" data-act="replay">'+icon("retry")+'Replay checks</button>')+
    '<div class="runbar"><div class="runbar-left">'+icon("clock")+'<strong>Replay '+String(scheduleState.runCount).padStart(2,"0")+'</strong><span class="separator">·</span><span>'+ (scheduleState.lastAt?"Last replay "+scheduleDate(scheduleState.lastAt):"Historical sample · "+replayDate) +'</span></div><div class="actions">'+badge("Completed with 1 retry needed","amber")+badge(scheduleState.enabled?cadence(scheduleState.days)+" · demo":"Schedule paused",scheduleState.enabled?"blue":"")+'</div></div>'+
    '<div class="tiles" aria-label="Replay summary">'+
      tile("Countries with open changes",openCountries().length,"Plus 1 shared EU update","countries")+
      tile("Open changes",openChanges().length,(ukOpen()?"2 UK or GB":"1 GB")+" · 1 shared EU","changes")+
      tile("Studies to review",ukOpen()?studies.filter(study=>study.status==="Batch review").length:0,"UK labeling · fictional portfolio","studies")+
      tile("Checks to retry",retryCount,"Coverage gap in Great Britain","alert","retry-filter")+
    '</div>'+regionCard();
}
function tile(title,value,hint,symbol,target) {
  const body='<div class="tile-top"><span class="tile-icon">'+icon(symbol)+'</span>'+title+'</div><strong>'+value+'</strong><small>'+hint+'</small>';
  return target?'<button type="button" class="tile" data-act="metric" data-value="'+target+'">'+body+'</button>':'<div class="tile">'+body+'</div>';
}
function changeRow(change) {
  return '<button type="button" class="change" data-act="open-case" data-value="'+change.id+'"><span class="change-mark">'+icon("changes")+'</span><span><span class="change-top"><strong>'+change.title+'</strong>'+
    badge(...(change.id==="uk"?caseStatus():[change.status,change.tone]))+'</span><small>'+change.scope+' · '+change.kind+' · '+change.when+'</small><span class="change-summary">'+change.summary+'</span></span>'+icon("chevron")+'</button>';
}
function regionCard() {
  const content=regions.map(region=>{
    const local=openCountries().filter(country=>country.region===region);
    const shared=region==="Europe"?changes.filter(change=>change.scope==="EU"):[];
    const summary=local.length ? local.length+(local.length===1?" country":" countries")+" with open changes" : shared.length ? "Shared updates" : "Outside replay coverage";
    const countryLinks=local.map(country=>'<h3 class="jurisdiction">'+country.name+'</h3>'+openChangeIds(country).map(id=>changeRow(changes.find(change=>change.id===id))).join("")).join("");
    const sharedLinks=shared.length?'<h3 class="jurisdiction">European Union · shared scope</h3>'+shared.map(changeRow).join(""):"";
    return '<details class="region" data-region="'+region+'"'+(expandedRegions.has(region)?" open":"")+'><summary>'+icon("chevron")+'<span class="region-label"><strong>'+region+'</strong><small>'+summary+'</small></span></summary>'+
      (countryLinks+sharedLinks || '<div class="region-child"><small>This replay contains no checks for this region.</small></div>')+'</details>';
  }).join("");
  const resolved=changes.filter(change=>!openChanges().includes(change));
  const history=resolved.length?'<details class="region source-references"><summary>Resolved changes ('+resolved.length+')</summary>'+resolved.map(changeRow).join("")+'</details>':"";
  return '<section id="regions" class="card" aria-labelledby="regions-title"><div class="card-head"><div><h2 id="regions-title">Changes by region</h2><p>Open monitoring cases</p></div></div><div class="region-list">'+content+'</div>'+history+'</section>';
}
const countryById = id => countries.find(country=>country.id===id);
function publishedRecord(record) {
  if(record.id!=="uk-label") return record;
  const current=workflow.publication;
  return {...record,title:current?record.title:"UK IMP labeling reference",
    status:current?"Published country record · v2":"Seeded baseline · v1",
    when:current?"Effective 28 Apr 2026":"Legacy cohort reference",
    ...(current?{}:{source:null,basis:"Earlier UK regulation",locator:"Pre-amendment Part 7, regulation 46",url:"https://www.legislation.gov.uk/cy/uksi/2004/1031/body/2025-07-23"}),
    summary:current?current.policy+" "+current.instruction:ukCase.baseline};
}
const recordsFor = country => requirements.filter(record=>record.country===country.id || (record.shared && country.shared)).map(publishedRecord);
function countryList() {
  const query=countrySearch.trim().toLowerCase();
  const groups=regions.map(region=>{
    const matches=countries.filter(country=>country.region===region && (country.name.toLowerCase().includes(query)||region.toLowerCase().includes(query)));
    if (!matches.length) return "";
    return '<div class="section-label">'+region+'</div>'+matches.map(country=>{
      const count=recordsFor(country).length;
      const status=openChangeIds(country).length?"Open changes":count?"Sample coverage":"Not assessed";
      return '<button type="button" class="country-row" data-act="pick-country" data-value="'+country.id+'" aria-pressed="'+(currentCountry===country.id)+'"><span><strong>'+country.name+'</strong><small class="sub">'+status+'</small></span>'+icon("chevron")+'</button>';
    }).join("");
  }).join("");
  return groups||'<p class="nothing">No countries match this search.</p>';
}
function options(values,selected) {
  return values.map(([value,label])=>'<option value="'+esc(value)+'"'+(value===selected?" selected":"")+'>'+esc(label)+'</option>').join("");
}
function countryRequirements() {
  const country=countryById(currentCountry);
  const all=recordsFor(country);
  const filtered=all.filter(record=>(countryTopic==="all"||record.topic===countryTopic) && (countryScope==="all"||(countryScope==="shared"?record.shared:!record.shared)));
  const hasLocal=all.some(record=>!record.shared);
  const coverage=hasLocal ? "Sample country coverage" : all.length ? "Shared EU coverage only" : "Not assessed";
  const links=[...openChangeIds(country),...(country.shared??[])].map(id=>{
    const change=changes.find(item=>item.id===id);
    return trigger(change.title,"open-case",id,"","file");
  });
  const rows=filtered.map(record=>'<button type="button" class="req-row" data-act="requirement" data-value="'+record.id+'"><span><strong>'+record.title+'</strong><small class="sub">'+record.topic+' · '+record.scope+' · '+record.basis+'</small><small class="sub">'+record.when+'</small></span>'+icon("chevron")+'</button>').join("");
  const coveredTopics=new Set(all.map(record=>record.topic));
  const missing=topics.filter(topic=>!coveredTopics.has(topic));
  return '<section class="card"><div class="card-head"><div><h2>'+country.name+'</h2><p>'+country.region+' · '+all.length+' sample records</p></div>'+badge(coverage,hasLocal?"blue":all.length?"purple":"")+'</div>'+
    '<div class="card-foot"><div class="filters"><label class="field">Topic<select id="country-topic">'+options([["all","All topics"],...topics.map(topic=>[topic,topic])],countryTopic)+'</select></label><label class="field">Record scope<select id="country-scope">'+options([["all","All scopes"],["local","Country-specific"],["shared","Shared EU"]],countryScope)+'</select></label></div></div>'+
    (rows?'<div class="req-list">'+rows+'</div>':'<p class="nothing">'+(all.length?"No records match these filters.":"This prototype has no reviewed records for this country.")+'</p>')+
    '<div class="inline-note">'+icon("info")+'<span>'+esc((all.length && !hasLocal?"Country-specific requirements are not assessed. ":"")+(missing.length?"No sample coverage for "+missing.join(", ")+".":""))+'</span></div>'+
    (links.length?'<div class="card-foot"><small>Related open changes</small><div class="actions">'+links.join("")+'</div></div>':"")+'</section>';
}
function countryLibrary() {
  return heading("Country requirements","Browse the clinical supply library by country, topic and jurisdiction.")+
    '<div class="library-layout"><section class="card"><div class="card-head"><label class="field" style="width:100%">Find a country<input id="country-search" type="search" placeholder="Country or continent" value="'+esc(countrySearch)+'"></label></div><div id="country-list">'+countryList()+'</div></section><div id="country-requirements">'+countryRequirements()+'</div></div>';
}
function requirementDetail(id) {
  const record=publishedRecord(requirements.find(item=>item.id===id));
  const source=sources.find(item=>item.id===record.source);
  drawer("Country requirements library",record.title,badge(record.status,"blue")+
    factlist([["Jurisdiction",record.scope],["Topic",record.topic],["Source type",record.basis],["Date or edition",record.when],["Source provision",record.locator]])+
    block("Requirement summary",record.summary)+
    '<div class="actions">'+openLink("Open official source",source?.url??record.url,"primary")+
    (record.id==="uk-label"?trigger("View versions","case-history","uk","","arrow"):record.related?trigger("View related change","open-case",record.related,"","arrow"):"")+'</div>');
}
function monitoringSchedule() {
  return heading("Monitoring schedule","Set the interval for automatic checks.")+
    '<div class="layout">'+
    '<section class="card"><div class="card-head"><div><h2>Automatic checks</h2><p>Browser demo settings</p></div>'+badge(scheduleState.enabled?cadence(scheduleState.days):"Paused",scheduleState.enabled?"blue":"")+'</div><div class="settings">'+
    '<form id="schedule-form"><label class="toggle"><input type="checkbox" name="enabled"'+(scheduleState.enabled?" checked":"")+'> Enable automatic replay</label><label class="field">Repeat every (days)<input type="number" name="days" min="1" max="365" step="1" value="'+scheduleState.days+'" required></label><div class="actions"><button type="submit" class="btn primary">Save schedule</button></div></form>'+
    '<div class="inline-note">'+icon("info")+'<span>Runs the saved sample while this page is open. If a run is missed, the next visit replays it once. Live background monitoring requires a deployed scheduler.</span></div></div></section>'+
    '<section class="card"><div class="card-head"><div><h2>Run status</h2><p>Schedule times are shown in Athens time.</p></div></div><div class="settings">'+
    '<div id="run-status">'+runStatus()+'</div></div></section></div>';
}
function sourceTable(data) {
  if (!data.length) return '<p class="nothing">No pages match these filters.</p>';
  const rows=data.map(source=>'<tr><td><button class="entity-button" type="button" data-act="source-detail" data-value="'+source.id+'">'+icon("file")+'<span>'+source.title+'<small class="sub">'+source.authority+' · '+source.path+'</small></span></button></td><td class="nowrap muted">'+source.checked+'</td><td>'+badge(source.status,source.tone)+'</td><td class="hide-narrow">'+source.scope+'</td><td class="hide-narrow">'+source.type+'</td></tr>').join("");
  return '<div class="table-wrap" tabindex="0"><table><caption class="sr">Source pages checked in the replay</caption><thead><tr><th>Page checked</th><th>UTC</th><th>Check status</th><th class="hide-narrow">Scope</th><th class="hide-narrow">Source type</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function tableMatches(source) {
  const matchStatus=sourceFilter==="all"||source.status===sourceFilter;
  const haystack=[source.title,source.authority,source.scope,source.path,source.section].join(" ").toLowerCase();
  return matchStatus&&haystack.includes(sourceSearch.trim().toLowerCase());
}
function sourceCard() {
  const filters='<div class="filters"><label class="field">Find a page<input id="source-search" type="search" placeholder="Page or authority" value="'+esc(sourceSearch)+'"></label><label class="field">Check status<select id="source-filter">'+options([["all","All statuses"],...["Changed","Unchanged","Retry needed"].map(status=>[status,status])],sourceFilter)+'</select></label></div>';
  return '<section class="card"><div class="card-head">'+filters+'</div><div id="source-results">'+sourceTable(sources.filter(tableMatches))+'</div></section>';
}
function studyCard() {
  const change=selectedChange();
  const selected=filteredStudies();
  const registry=studyView==="registry";
  const name=registry?"Public registry matches":"Portfolio impact";
  const tabs=currentChange==="uk"?'<div class="study-tabs" role="group" aria-label="Study dataset"><button type="button" data-act="study-view" data-value="portfolio" aria-pressed="'+!registry+'">Demo portfolio</button><button type="button" data-act="study-view" data-value="registry" aria-pressed="'+registry+'">Public registry</button></div>':"";
  const content=selected.length?'<div class="table-wrap" tabindex="0"><table><caption class="sr">'+name+'</caption><thead><tr><th>Study</th><th>Listed location</th><th>'+ (registry?"Screening result":"Assessment") +'</th><th class="hide-narrow">'+(registry?"Registry status":"Reason")+'</th></tr></thead><tbody>'+selected.map(study=>'<tr><td><button type="button" class="entity-button" data-act="study-detail" data-value="'+study.id+'"><span>'+esc(study.title)+'<small class="sub">'+study.id+' · '+study.sponsor+'</small></span></button></td><td>'+study.sites+'</td><td>'+badge(registry?"Candidate match":study.status,registry?"blue":study.tone)+'</td><td class="hide-narrow muted">'+(registry?study.status+' · '+study.posted:study.reason)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="nothing">No fictional portfolio assessment is loaded for this change. Open Public registry to see candidates.</p>';

  return '<section class="card"><div class="card-head study-head"><h2>'+name+'</h2>'+tabs+'</div>'+content+'<div class="inline-note">'+icon("info")+'<span>'+note+'</span></div><div class="card-foot"><small>'+ (registry?registryCredit:"Synthetic study and supply records") +'</small></div></section>';
}
function resourceCard(name,text,url,linkName) {
  return '<article class="card resource"><h2>'+esc(name)+'</h2><p>'+esc(text)+'</p><div>'+openLink(linkName,url)+'</div></article>';
}
function sourceReferences() {
  return '<details class="card source-references space"><summary>Study data sources</summary><div class="drawer-body"><div class="resource-grid">'+resources.map(item=>resourceCard(item.name,item.text,item.url,"Open data source")).join("")+'</div></div></details>';
}
function panel(title,description,body,action="") {
  return '<section class="card"><div class="card-head"><div><h2>'+esc(title)+'</h2>'+(description?'<p>'+esc(description)+'</p>':"")+'</div>'+action+'</div>'+body+'</section>';
}
const casePad = body => '<div class="case-pad">'+body+'</div>';
const listItems = items => '<ul class="case-list">'+items.map(item=>'<li>'+item+'</li>').join("")+'</ul>';
const displayDay = day => day ? new Intl.DateTimeFormat("en-GB",{dateStyle:"medium",timeZone:"UTC"}).format(new Date(day)) : "Unknown";
function caseRoleSelect() {
  return '<label class="field">Demo role<select id="workflow-role">'+options(Object.entries(workflowRoles),workflowRole)+'</select></label>';
}
function workflowNavigation() {
  const tabs=[["impact","Evidence & impact"]];
  if(currentChange==="uk"){
    tabs.push(["proposal","SME decision"],["history","Country record"]);
    if(workflow.task) tabs.push(["follow-up","Quality follow-up"]);
  }
  return tabs.length>1?'<div class="case-tabs" role="group" aria-label="Case sections">'+tabs.map(([id,title])=>
    '<button type="button" data-act="workflow-tab" data-value="'+id+'" aria-pressed="'+(workflowTab===id)+'">'+title+'</button>').join("")+'</div>':"";
}
function workflowEvidence() {
  const rows=ukCase.evidence.map(item=>{
    const source=sources.find(entry=>entry.id===item.source);
    return '<div class="evidence-item">'+badge("Tier "+item.tier,item.tier===1?"blue":"purple")+
      '<h3>'+esc(item.kind)+' · '+esc(item.locator)+'</h3><p>“'+esc(item.excerpt)+'”</p>'+
      '<button type="button" class="quiet small-action" data-act="source-detail" data-value="'+source.id+'">'+esc(source.authority+' · '+source.edition)+icon("arrow")+'</button></div>';
  }).join("");
  const before=sources.find(source=>source.id==="statute");
  return panel("Regulatory evidence","Official excerpts and source versions",casePad(
    factlist([["Instrument",before.edition+" · S.I. 2025/538"],["Commencement",displayDay(ukCase.effective)],["Guidance edition","15 Jul 2026"]])+
    '<p>Regulation 32 replaced the earlier Part 7. Schedule 14 preserves the legacy pathway under defined conditions.</p>'+rows));
}
function compareValues(leftTitle,left,rightTitle,right) {
  return '<div class="compare"><div><h3>'+esc(leftTitle)+'</h3><p>'+esc(left)+'</p></div><div><h3>'+esc(rightTitle)+'</h3><p>'+esc(right)+'</p></div></div>';
}
function actionForm(fields,buttons) {
 return '<form id="workflow-form" class="review-form" data-revision="'+workflow.revision+'">'+fields+
   '<div class="actions">'+buttons.map(([value,title,tone])=>'<button type="submit" name="action" value="'+value+'" class="btn '+(tone??"")+'">'+esc(title)+'</button>').join("")+'</div><div id="workflow-error" class="form-feedback" role="alert"></div></form>';
}
const reasonField = label => '<label class="field">'+esc(label)+'<textarea name="reason" maxlength="2000" required></textarea></label>';
const reviewDecisions=[["approve","Approve & publish"],["edit","Edit & approve"],["reject","Reject"],["investigate","Request investigation"],["defer","Defer"]];
function decisionFields() {
  if(reviewDecision==="edit") return '<label class="field">Operational instruction<textarea name="instruction" maxlength="2000" required>'+esc(workflow.draft)+'</textarea></label>';
  if(reviewDecision==="defer") return '<label class="field">Return-to-review date<input type="date" name="reviewOn" required></label>';
  return "";
}
function workflowDecision() {
  const decision=workflow.decision;
  if(workflow.stage==="review") {
    if(workflowRole!=="reviewer") return '<p>Choose the Regulatory SME demo role to record a decision.</p>';
    const fields=decisionFields();
    return '<form id="workflow-form" class="review-form" data-revision="'+workflow.revision+'">'+
      (aiBlocked()?'<p class="form-feedback">The latest AI check failed, so Approve and Edit &amp; approve are blocked. Re-run the AI check, reject, or request an investigation.</p>':"")+
      '<label class="field">Decision<select id="review-decision" name="decision">'+options(reviewDecisions,reviewDecision)+'</select></label>'+
      '<div id="decision-fields"'+(fields?"":" hidden")+'>'+fields+'</div>'+reasonField("Decision rationale")+
      '<div class="actions"><button id="record-decision" type="submit" name="action" value="'+reviewDecision+'" class="btn primary">'+reviewDecisions.find(([id])=>id===reviewDecision)[1]+'</button></div>'+
      '<div id="workflow-error" class="form-feedback" role="alert"></div></form>';
  }
  const details=decision?factlist([["Decision by",decision.actor],["Rationale",decision.rationale],["Recorded",scheduleDate(decision.time)],
    ...(decision.reviewOn?[["Return to review",displayDay(decision.reviewOn)]]:[])]):"";
  const canResume=["investigating","deferred"].includes(workflow.stage)&&workflowRole==="reviewer";
  return details+(canResume?actionForm(reasonField("Reason to resume review"),[["resume","Resume as new revision","primary"]]):"");
}
function workflowProposal() {
  const decision=panel("SME decision","Demo role and rationale are recorded in the case history.",casePad(workflowDecision()),caseRoleSelect());
  const published=workflow.publication;
  const proposed=panel("Country requirement comparison",ukCase.requirement+" · Proposal revision "+workflow.revision,
    compareValues("Seeded baseline · v1",ukCase.baseline,published?"Approved country value":"Proposed country value",published?.policy??ukCase.policy)+
    '<div class="case-pad" style="padding-top:11px"><h3>Scope and conditions</h3>'+listItems(ukCase.conditions.map(esc))+'<p>'+esc(workflow.draft)+'</p></div>');
  const confidence=panel("Confidence by dimension","Qualitative evidence assessment",casePad(factlist([
    ["Detection","High · instrument and MHRA sources agree on commencement"],["Extraction","High · cited provisions and guidance are available"],
    ["Applicability","Mixed · missing QP date and cutoff-day case"],["Interpretation",published?"Approved for the country record in this demo":"Requires authorized SME decision"]
  ])));
  return '<div class="case-layout"><div class="case-stack">'+proposed+decision+'</div>'+confidence+'</div>';
}
function workflowHistory() {
  const publication=workflow.publication;
  const history=publication?compareValues("Previous record · v1",ukCase.baseline,"Published record · v2",publication.policy+" "+publication.instruction):
    casePad('<p>'+esc(ukCase.baseline)+'</p>');
  const receipt=publication?casePad(factlist([["Receipt","LOCAL-REC-02"],["Approved revision",publication.revision],["Published",scheduleDate(publication.at)],
    ["Effective date",displayDay(publication.effective)],["Evidence",publication.evidenceIds.join(", ")]])):
    casePad('<p>Version 1 is the published demo baseline. A new version appears after SME approval.</p>');
  const query=casePad('<label class="field">Ordinary cohort date<input type="date" id="record-as-of" value="'+ukCase.effective+'"></label><p id="record-as-of-result" aria-live="polite">'+asOfText(ukCase.effective)+'</p><p>Use the batch assessment for Schedule 14 transition checks.</p>');
  return '<div class="case-layout"><div class="case-stack">'+panel("Version history",ukCase.requirement,history)+panel("Look up an applicable version","Ordinary cohort",query)+'</div>'+
    '<div class="case-stack">'+panel("Publication receipt","Local country platform simulation",receipt)+'</div></div>';
}
function asOfText(day) {
 if(!day) return "Choose an operational date.";
 if(workflow.publication && day>=workflow.publication.effective) return "Version 2 is effective for the ordinary cohort.";
 if(day>=ukCase.effective) return "Version 1 is the published baseline. No update has been published for this date in the demo.";
 return "Version 1 is the pre-amendment record.";
}
function taskStateLabel(status) {
  return {assigned:"Assigned",acknowledged:"Acknowledged",submitted:"Evidence submitted",verified:"Verified"}[status];
}
function workflowFollowUp() {
  const task=workflow.task;
  let content='<p>The mock task appears after the country update is published.</p>';
  if(task) {
    content=factlist([["Owner",task.owner],["Sample due date",displayDay(task.dueOn)],["Published record","Version "+task.version+" · proposal revision "+task.revision],
      ["Status",taskStateLabel(task.status)],["Case",workflow.stage==="closed"?"Closed":"Open"],["Studies",task.studyIds.join(", ")],
      ["Batches",task.batchIds.join(", ")],["Shipments to assess",task.shipmentIds.join(", ")],
      ...(task.evidence?[["Last submitted evidence",task.evidence.reference]]:[])]);
    if(task.status==="assigned"&&workflowRole==="owner") content+=actionForm("",[["ack","Acknowledge task","primary"]]);
    else if(task.status==="acknowledged"&&workflowRole==="owner") content+=actionForm(reasonField("Mock implementation evidence reference"),[["implement","Submit evidence","primary"]]);
    else if(task.status==="submitted"&&workflowRole==="verifier") content+=actionForm(reasonField("Verification rationale"),[["verify","Verify & close case","primary"],["return","Return evidence"]]);
    else if(task.status!=="verified") content+='<p>Select '+(task.status==="submitted"?"Quality verifier":"Quality action owner")+' to continue the mock handoff.</p>';
  }
  return panel("Quality follow-up",task?task.id+" · Simulated QMS task":"Awaiting publication",casePad(content),caseRoleSelect());
}
function auditPanel() {
  return '<details class="card source-references space"><summary>Audit trail ('+workflow.events.length+')</summary><div class="drawer-body"><div class="actions">'+
    trigger("Export audit JSON","export-workflow","","","file")+' '+trigger("Reset demo case","reset-workflow","","","retry")+'</div>'+
    listItems([...workflow.events].reverse().map(event=>'<strong>'+esc(event.type.replaceAll("."," · ").replaceAll("_"," "))+'</strong><small>'+esc(event.actor+" · "+scheduleDate(event.at)+" · revision "+event.revision)+'</small><small>'+esc(event.detail)+'</small>'))+'</div></details>';
}
let aiState = {phase:location.protocol.startsWith("http")?"idle":"offline",status:null,result:null,error:"",fresh:false};
async function aiRequest(path,options={}) {
  const response=await fetch(path,{cache:"no-store",...options});
  const body=await response.json().catch(()=>({}));
  if(!response.ok) throw Error(body.error||"Request failed ("+response.status+")");
  return body;
}
const aiBlocked = () => Boolean(aiState.result && !aiState.result.verification.verified);
function refreshAi() {const card=byId("ai-card");if(card) card.outerHTML=aiCard();}
async function loadAi() {
  if(aiState.phase==="offline") return;
  try {
    aiState.status=await aiRequest("/api/ai/status");
    if(aiState.status.recorded) aiState.result=await aiRequest("/api/ai/analysis");
  } catch {aiState.phase="offline";}
  refreshAi();
}
async function runAi() {
  aiState={...aiState,phase:"running",error:""};
  refreshAi();
  notify("Fetching the official sources and asking the AI. This can take a minute.");
  try {
    aiState.result=await aiRequest("/api/ai/analyze",{method:"POST"});
    aiState.fresh=true;
    notify(aiState.result.verification.verified?"AI check complete. All checks passed.":"AI check complete. Some checks failed, so SME approval is blocked.");
  } catch(error) {
    aiState.error=error.message;
    notify("AI check failed.");
  }
  aiState.phase="idle";
  refreshAi();
  byId("ai-run")?.focus();
}
function aiSetupHints() {
  const status=aiState.status;
  if(!status) return "";
  const hints=[];
  if(!status.sdk) hints.push("Run npm install once in the RegChain folder, then restart the launcher.");
  if(!status.keySet) hints.push("Add ANTHROPIC_API_KEY to a .env file next to serve-regchain.cjs.");
  return hints.length?'<div class="inline-note">'+icon("info")+'<span>'+esc(hints.join(" "))+'</span></div>':"";
}
function aiResult(result) {
  const {draft,verification,sources:read,diff}=result;
  const failed=verification.checks.filter(check=>!check.ok).length;
  const gate='<div class="ai-gate">'+(verification.verified?badge("All checks passed · ready for SME review","green"):badge("SME approval blocked · "+failed+(failed===1?" check":" checks")+" failed","red"))+'</div>';
  const checks=listItems(verification.checks.map(check=>badge(check.ok?"Pass":"Fail",check.ok?"green":"red")+' <strong>'+esc(check.label)+'</strong><small>'+esc(check.detail)+'</small>'));
  const titleOf=id=>read.find(source=>source.id===id)?.title||id;
  const claims=listItems(verification.claims.map(claim=>'<div class="ai-claim">'+badge(claim.found?"Found in source":"Not found",claim.found?"green":"red")+esc(claim.statement)+'</div>'+
    '<p class="ai-quote">“'+esc(claim.quote)+'”</p><small>'+esc(titleOf(claim.sourceId))+(claim.found?"":" · "+esc(claim.reason))+'</small>'));
  const rows=read.map(source=>'<tr><td><a href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">'+esc(source.title)+'</a><span class="sub">'+esc(source.authority)+'</span></td>'+
    '<td class="nowrap">'+esc(source.validFrom?displayDay(source.validFrom.slice(0,10)):"Unknown")+(source.validUntil?' to '+esc(displayDay(source.validUntil.slice(0,10))):"")+'</td>'+
    '<td class="mono">'+esc(source.hash?source.hash.slice(0,12):"—")+'</td><td>'+badge(source.origin==="live"?"Fetched":source.origin==="cache"?"Cached copy":"Missing",source.origin==="live"?"blue":source.origin==="cache"?"amber":"red")+'</td></tr>').join("");
  const changed=diff.lines.filter(line=>line.type!=="same");
  const diffView='<details class="diff"><summary>What changed in regulation 46 · '+diff.added+' lines added, '+diff.removed+' removed</summary><ol>'+
    changed.map(line=>'<li class="'+(line.type==="added"?"add":"del")+'">'+(line.type==="added"?"+ ":"− ")+esc(line.text)+'</li>').join("")+'</ol></details>';
  const transition=draft.transition||{applies:false,conditions:[]};
  return gate+checks+
    '<h3>Sources read</h3><div class="table-wrap ai-sources"><table><thead><tr><th>Source</th><th>Version</th><th>Fingerprint</th><th>Copy</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+diffView+
    '<h3>AI draft for '+esc(result.rule.requirement)+'</h3><p>'+esc(draft.summary)+'</p>'+
    factlist([["Change status",draft.status],["Effective date",draft.effectiveDate],["Scope",draft.scope],["Transition",transition.applies?"Earlier rules can continue under conditions":"No transition found"]])+
    (transition.conditions.length?listItems(transition.conditions.map(esc)):"")+
    compareValues("Current company record · v1",ukCase.baseline,"AI draft · not yet approved",draft.proposedRequirement)+
    '<h3>Claims and their quotes</h3>'+claims+
    (draft.uncertainties.length?'<h3>For the SME to confirm</h3>'+listItems(draft.uncertainties.map(esc)):"")+
    '<div class="card-foot"><small>'+esc((aiState.fresh?"Live check":"Recorded check")+" · "+scheduleDate(Date.parse(result.at))+" · "+result.model)+'</small></div>';
}
function aiCard() {
  const busy=aiState.phase==="running";
  const offline=aiState.phase==="offline";
  const result=aiState.result;
  const mode=busy?badge("Running","blue"):offline?badge("Needs the local server"):result?badge(aiState.fresh?"Live":"Recorded",aiState.fresh?"blue":""):badge("Not run yet");
  const action=offline?mode:'<div class="actions">'+mode+'<button id="ai-run" type="button" class="btn primary" data-act="ai-run"'+(busy?" disabled":"")+'>'+icon("retry")+(busy?"Checking…":result?"Run again":"Run AI check")+'</button></div>';
  const intro='<p>Claude reads the official versions of regulation 46 before and after 28 April 2026, Schedule 14 paragraph 6 and the MHRA labelling guidance, then drafts the change. RegChain checks every quote against the source text and the effective date against the recorded rule. A failed check blocks SME approval.</p>';
  const body=offline?'<p>Open the dashboard with Start-RegChain.cmd to use the AI check. It needs the local server.</p>':
    aiSetupHints()+(aiState.error?'<p class="form-feedback" role="alert">'+esc(aiState.error)+'</p>':"")+(result?aiResult(result):"");
  return '<div id="ai-card" class="ai-card">'+panel("AI reading of the source change","Official texts fetched live · checked by RegChain, decided by the SME",casePad(intro+body),action)+'</div>';
}
function caseImpact() {
  const change=selectedChange();
  const evidence=change.id==="uk"?workflowEvidence():panel("Regulatory evidence",change.authority+" · "+change.when,casePad(
    compareValues("Previous reference",change.before,"What changed",change.after)+
    '<div class="evidence-item"><h3>Supporting sources</h3><div class="actions">'+change.evidence.map(id=>trigger(sources.find(source=>source.id===id).title,"source-detail",id,"","file")).join("")+'</div></div>'));
  const facts=change.id==="uk"?[
    ["Severity","High · potential labeling or supply disruption"],
    ["Operational urgency","Priority · sample review by "+displayDay(shipmentFindings()[0].preparationDate)],
    ["Legal date basis","Date of finished-IMP QP certification"],
    ["Portfolio scope","2 UK studies · 5 UK batches · 2 shipments to assess"]
  ]:[["Applicability","Public registry screening only"]];
  const context=panel("Assessment",change.id==="uk"?ukCase.snapshot:"",casePad(factlist(facts)+'<h3>Inputs to check</h3><p>'+esc(change.need)+'</p>'));
  return (change.id==="uk"?aiCard():"")+'<div class="case-layout">'+evidence+context+'</div><div id="study-card" class="space">'+studyCard()+operationalImpact()+'</div>';
}
function changeWorkspace() {
  const change=selectedChange();
  const content={impact:caseImpact,proposal:workflowProposal,history:workflowHistory,"follow-up":workflowFollowUp};
  const status=change.id==="uk"?caseStatus():[change.status,change.tone];
  return heading(esc(change.title),esc((change.id==="uk"?ukCase.id+" · ":"")+change.scope+" · "+change.kind+" · "+change.when),badge(...status))+
    workflowNavigation()+content[workflowTab]()+(change.id==="uk"?auditPanel():"");
}
function impactTable(title,description,columns,rows) {
 return panel(title,description,'<div class="table-wrap" tabindex="0" aria-label="'+esc(title)+'"><table><thead><tr>'+
   columns.map(column=>'<th scope="col">'+esc(column)+'</th>').join("")+'</tr></thead><tbody>'+
   rows.map(row=>'<tr>'+row.map(cell=>'<td>'+esc(cell)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>');
}
function operationalImpact() {
  if(currentChange!=="uk"||studyView!=="portfolio") return "";
  const shipments=shipmentFindings();
  return '<div class="case-stack space">'+impactTable("Batch applicability","Fictional portfolio · finished-IMP QP certification drives the date comparison",
    ["Batch","Study","QP date","Label","Assessment","Basis"],assessedBatches.map(batch=>[batch.id,batch.study,displayDay(batch.qp),batch.label,batch.status,
      (batch.made?"Physical manufacture "+displayDay(batch.made)+". ":"")+batch.reason]))+
    impactTable("Shipments and partners","Planning dates set preparation priority. Labeling applicability comes from the linked batch.",
      ["Shipment / batch","Destination","Planned dispatch","Prep target","Partner","Assessment"],shipments.map(shipment=>[shipment.id+" / "+shipment.batch,shipment.destination,displayDay(shipment.date),
        shipment.status==="Out of scope"?"—":displayDay(shipment.preparationDate),shipment.partner,shipment.status]))+'</div>';
}
const views = {
  overview,
  countries:countryLibrary,
  schedule:monitoringSchedule,
  case:changeWorkspace,
  sources:()=>heading("Source log","Review page checks, retry status and linked evidence.")+sourceCard()+sourceReferences(),
};
function render() {shell();byId("view").innerHTML=views[page]();updateRun();}
function notify(text="") {byId("announce").textContent=text;}
function navigate(to) {page=to;render();byId("page-title").focus({preventScroll:true});window.scrollTo(0,0);}
function factlist(facts) {
  return '<dl class="facts">'+facts.map(([label,value])=>'<div><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>').join("")+'</dl>';
}
function block(title,text) {return '<section class="drawer-block"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p></section>';}
function drawer(type,title,content) {
  const modal=byId("drawer");
  if (!modal.open) drawerOrigin=document.activeElement;
  byId("drawer-type").textContent=type;
  byId("drawer-title").textContent=title;
  byId("drawer-body").innerHTML=content;
  if (!modal.open) modal.showModal();
  modal.scrollTop=0;
  modal.querySelector(".close").focus();
}
function sourceDetail(id) {
  const source=sources.find(item=>item.id===id);
  drawer("Source check",source.title,badge(source.status,source.tone)+factlist([
    ["Authority",source.authority],["Scope",source.scope],["Check time",replayDate+" · "+source.checked+" UTC (replay)"],
    ["Source edition",source.edition],["Compared section",source.status==="Retry needed"?"Comparison pending":source.section]
  ])+block("Check result",source.result)+'<section><h3>Page URL</h3><a class="url" href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">'+esc(source.url)+'</a></section>'+
  (source.change && page==="sources"?'<div>'+trigger("View related change","open-case",source.change,"","arrow")+'</div>':""));
}
function studyDetail(id) {
  const isPublic=id.startsWith("NCT");
  const study=(isPublic?publicStudies:studies).find(item=>item.id===id);
  const change=selectedChange();
  if(isPublic) {
    drawer("ClinicalTrials.gov · public registry",study.title,badge("Candidate match","blue")+factlist([["Registry ID",study.id],["Sponsor",study.sponsor],["Listed locations",study.sites],["Registry status",study.status],["Last update posted",study.posted]])+
      block("Why it surfaced","The sample record lists a site in the jurisdiction screened for "+change.title+".")+
      block("Information needed to assess impact",change.need)+'<p>'+esc(registryCredit)+'</p><div>'+openLink("Open registry record",study.url,"primary")+'</div>');
  } else {
    drawer("Fictional portfolio",study.title,badge(study.status,study.tone)+factlist([["Study ID",study.id],["Location",study.sites],["Related change",change.title],["Batches",study.batches.join(", ")]])+
      block("Assessment",study.detail));
  }
}
function selectChange(id) {
  currentChange=id;
  studyView=studies.some(study=>study.changes.includes(id))?"portfolio":"registry";
}
function updateStudies() {
  byId("study-card").innerHTML=studyCard()+operationalImpact();
}
function replay(reason="manual") {
  if (replaying) return;
  replaying=true;updateRun();notify("Replaying the six recorded checks.");
  window.setTimeout(()=>{
    scheduleState=readScheduleOrCurrent();
    if (reason==="scheduled" && (!scheduleState.enabled || scheduleState.nextAt>Date.now())) {
      replaying=false;
      updateRun();
      notify();
      return;
    }
    const now=Date.now();
    scheduleState.runCount++;
    scheduleState.lastAt=now;
    scheduleState.lastReason=reason;
    if (reason==="scheduled") {
      const interval=scheduleState.days*dayMs;
      scheduleState.nextAt+= (Math.floor((now-scheduleState.nextAt)/interval)+1)*interval;
    }
    storeSchedule();
    replaying=false;
    if (page==="overview" || page==="schedule") {
      const focused=byId("replay")===document.activeElement;
      if (!byId("schedule-form")?.contains(document.activeElement) || focused) {
        render();
        if(focused) byId("replay").focus();
      } else {
        byId("run-status").innerHTML=runStatus();
        updateRun();
      }
    }
    notify("Replay complete. Three sample changes reviewed. One source check needs retry.");
  },350);
}
function readScheduleOrCurrent() {
  try {return localStorage.getItem(scheduleKey)?readSchedule():scheduleState;}
  catch {return scheduleState;}
}
function checkDue() {
  scheduleState=readScheduleOrCurrent();
  const latest=readWorkflow(workflow);
  if(latest.stage==="deferred" && latest.decision?.reviewOn<=athensDay()) {
    latest.revision++;
    latest.stage="review";
    latest.decision=null;
    appendWorkflowEvent(latest,"proposal.returned_on_due_date","scheduler",new Date().toISOString(),"Deferred case returned to the review queue on its scheduled date.");
    workflow=latest;
    saveWorkflow(workflow);
    if(!byId("drawer").open && !byId("schedule-form")?.contains(document.activeElement)) render();
  }
  if(scheduleState.enabled && scheduleState.nextAt<=Date.now() && !replaying) replay("scheduled");
}
function athensDay() {
  const parts=new Intl.DateTimeFormat("en-GB",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Europe/Athens"}).formatToParts(new Date());
  return ["year","month","day"].map(type=>parts.find(part=>part.type===type).value).join("-");
}
function openCase(id,tab) {
  if(byId("drawer").open) byId("drawer").close();
  drawerOrigin=null;
  selectChange(id);
  workflowTab=tab??(id==="uk"&&workflow.task&&workflow.stage!=="closed"?"follow-up":"impact");
  navigate("case");
}
function exportWorkflow() {
  const data={caseId:ukCase.id,requirementId:ukCase.requirement,assessmentSnapshot:ukCase.snapshot,mode:"historical demo",
    evidence:ukCase.evidence.map(item=>({...item,url:sources.find(source=>source.id===item.source).url})),...workflow};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const anchor=document.createElement("a");
  anchor.href=url;
  anchor.download="RegChain-RC-UK-001-Audit.json";
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  window.setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const actions={
  nav:to=>{notify();navigate(to);},
  metric:target=>{
    if(target==="retry-filter"){sourceFilter="Retry needed";sourceSearch="";navigate("sources");return;}
  },
  replay:()=>replay(),
  "ai-run":()=>runAi(),
  "pick-country":id=>{
    currentCountry=id;
    countryTopic="all";
    countryScope="all";
    byId("country-list").innerHTML=countryList();
    byId("country-requirements").innerHTML=countryRequirements();
    const focusTarget=window.matchMedia("(max-width:760px)").matches?byId("country-topic"):byId("country-list").querySelector('[data-value="'+id+'"]');
    focusTarget.focus();
  },
  requirement:requirementDetail,
  "open-case":openCase,
  "case-history":id=>openCase(id,"history"),
  "workflow-tab":tab=>{workflowTab=tab;render();byId("view").querySelector('[data-act="workflow-tab"][data-value="'+tab+'"]').focus();},
  "export-workflow":exportWorkflow,
  "reset-workflow":()=>drawer("Historical demo","Reset the UK case?",
    '<p>Clear locally recorded decisions, publication and Quality follow-up for this demo case.</p><div>'+trigger("Reset demo case","confirm-reset-workflow","","primary","retry")+'</div>'),
  "confirm-reset-workflow":()=>{
    workflow=initialWorkflow();
    saveWorkflow(workflow);
    reviewDecision="approve";
    openCase("uk","proposal");
    notify("UK demo case reset.");
  },
  "source-detail":sourceDetail,
  "study-detail":studyDetail,
  "study-view":tab=>{studyView=tab;updateStudies();byId("study-card").querySelector('[data-value="'+tab+'"]').focus();notify(tab==="registry"?"Showing public registry candidates.":"Showing the fictional portfolio assessment.");}
};
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-act]");
  if(target && !target.disabled) actions[target.dataset.act](target.dataset.value);
});
document.addEventListener("input",event=>{
  if(event.target.id==="source-search"){
    sourceSearch=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches));
  }
  if (event.target.id==="country-search") {
    countrySearch=event.target.value;
    byId("country-list").innerHTML=countryList();
  }
});
document.addEventListener("change",event=>{
  if(event.target.id==="workflow-role") {
    workflowRole=event.target.value;
    render();
    byId("workflow-role").focus();
  }
  if(event.target.id==="record-as-of") byId("record-as-of-result").textContent=asOfText(event.target.value);
  if(event.target.id==="review-decision") {
    reviewDecision=event.target.value;
    const fields=decisionFields();
    byId("decision-fields").innerHTML=fields;
    byId("decision-fields").hidden=!fields;
    const submit=byId("record-decision");
    submit.value=reviewDecision;
    submit.textContent=reviewDecisions.find(([id])=>id===reviewDecision)[1];
    byId("workflow-error").textContent="";
  }
  if(event.target.id==="source-filter"){
    sourceFilter=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches));
  }
  if (event.target.id==="country-topic" || event.target.id==="country-scope") {
    const {id,value}=event.target;
    if(id==="country-topic") countryTopic=value;
    else countryScope=value;
    byId("country-requirements").innerHTML=countryRequirements();
    byId(id).focus();
  }
});
document.addEventListener("toggle",event=>{
  const region=event.target.dataset?.region;
  if (!region || !event.target.isConnected) return;
  if(event.target.open) expandedRegions.add(region);
  else expandedRegions.delete(region);
},true);
document.addEventListener("submit",event=>{
  if(event.target.id==="workflow-form"){
    event.preventDefault();
    if(!event.submitter) return;
    const fields=new FormData(event.target);
    const command={action:event.submitter.value,revision:Number(event.target.dataset.revision),
      reason:fields.get("reason"),instruction:fields.get("instruction"),reviewOn:fields.get("reviewOn"),today:athensDay()};
    if(["approve","edit"].includes(command.action) && aiBlocked()) {
      byId("workflow-error").textContent="The latest AI check failed, so approval is blocked. Re-run the AI check, reject, or request an investigation.";
      return;
    }
    const next=structuredClone(readWorkflow(workflow));
    try {workflowStep(next,command,workflowRole,new Date().toISOString());}
    catch(error){byId("workflow-error").textContent=error.message;return;}
    workflow=next;
    if(["approve","edit"].includes(command.action)) workflowTab="follow-up";
    if(command.action==="resume") reviewDecision="approve";
    const saved=saveWorkflow(workflow);
    render();
    byId("page-title").focus({preventScroll:true});
    notify(saved?"Demo workflow updated.":"Workflow updated for this tab. Browser storage is unavailable.");
    return;
  }
  if(event.target.id!=="schedule-form") return;
  event.preventDefault();
  scheduleState=readScheduleOrCurrent();
  const {enabled,days}=event.target.elements;
  const interval=Number(days.value);
  if(!Number.isInteger(interval)||interval<1||interval>365) return;
  const keepNext=scheduleState.enabled && scheduleState.days===interval;
  scheduleState={...scheduleState,enabled:enabled.checked,days:interval,
    nextAt:enabled.checked?(keepNext?scheduleState.nextAt:Date.now()+interval*dayMs):null};
  const saved=storeSchedule();
  render();
  byId("schedule-form").querySelector('button[type="submit"]').focus();
  notify(saved?"Schedule saved.": "Schedule applies to this tab. Browser storage is unavailable.");
  checkDue();
});
byId("drawer").addEventListener("close",()=>{if(drawerOrigin?.isConnected) drawerOrigin.focus();drawerOrigin=null;});
window.addEventListener("storage",event=>{
  if(event.key!==workflowKey) return;
  if(byId("workflow-form")?.contains(document.activeElement)) {
    notify("Case changed in another tab. Review the latest revision before submitting.");
    return;
  }
  workflow=readWorkflow();
  if(!byId("drawer").open) render();
});
render();
loadAi();
checkDue();
window.setInterval(checkDue,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkDue();});
</script>
