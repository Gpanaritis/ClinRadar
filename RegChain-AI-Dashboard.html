let scheduleState = readSchedule();

const selectedChange = () => changes.find(change=>change.id===currentChange);

function readSchedule() {
  const fallback={enabled:false,days:1,nextAt:null,lastAt:null,lastReason:null,runCount:1};
  try {
    const saved=JSON.parse(localStorage.getItem(scheduleKey));
    if (saved && typeof saved.enabled==="boolean" && Number.isInteger(saved.days) && saved.days>=1 && saved.days<=365 &&
      Number.isInteger(saved.runCount) && saved.runCount>=1 &&
      (!saved.enabled || Number.isFinite(saved.nextAt))) return {...fallback,...saved};
  } catch {}
  return fallback;
}
function storeSchedule() {
  try {localStorage.setItem(scheduleKey,JSON.stringify(scheduleState));}
  catch {return false;}
  return true;
}
function cadence(days) {return days===1?"Every day":"Every "+days+" days";}
function scheduleDate(value) {return value ? athens.format(value)+" Athens time" : "—";}
function runStatus() {
  const next=scheduleState.enabled?scheduleDate(scheduleState.nextAt):"Paused";
  const last=scheduleState.lastAt?scheduleDate(scheduleState.lastAt)+" · "+(scheduleState.lastReason==="scheduled"?"Scheduled replay":"Manual replay"):"Historical sample · "+replayDate;
  return factlist([["Next demo run",next],["Last run",last],["Source coverage",sources.length+" sample checks · "+retryCount+" retry needed"]]);
}

function shell() {
  byId("brand-mark").innerHTML=icon("logo");

}

}

    '<div class="tiles" aria-label="Replay summary">'+
      tile("Countries with open changes",currentOpenCountries.length,"Plus 1 shared EU update","countries","regions")+
      tile("Open changes",changes.length,"2 UK or GB · 1 shared EU","changes","changes")+
      tile("Studies to review",studies.filter(study=>study.status==="Batch review").length,"UK labeling · fictional portfolio","studies","studies")+

    '</div><div class="layout">'+regionCard()+changeCard(true)+'</div><div class="space" id="study-card">'+studyCard(true)+'</div>';

function tile(title,value,hint,symbol,target) {

function regionCard() {
  const content=regions.map(region=>{
    const local=currentOpenCountries.filter(country=>country.region===region);
    const shared=region==="Europe"?changes.filter(change=>change.scope==="EU"):[];
    const summary=local.length ? local.length+(local.length===1?" country":" countries")+" with open changes" : shared.length ? "Shared updates" : "Outside replay coverage";
    const countryLinks=local.map(country=>'<div class="region-child"><button type="button" class="country-control" data-act="country-page" data-value="'+country.id+'">'+country.name+'<small class="sub">UK and Great Britain scopes</small></button>'+badge(country.changes.length+" open changes","amber")+'</div>').join("");
    const sharedLinks=shared.map(change=>'<div class="region-child"><button type="button" class="country-control" data-act="change-detail" data-value="'+change.id+'">European Union<small class="sub">'+change.title+'</small></button>'+badge("Shared update","blue")+'</div>').join("");

const countryById = id => countries.find(country=>country.id===id);
const recordsFor = country => requirements.filter(record=>record.country===country.id || (record.shared && country.shared));
function countryList() {
  const query=countrySearch.trim().toLowerCase();
  const groups=regions.map(region=>{
    const matches=countries.filter(country=>country.region===region && (country.name.toLowerCase().includes(query)||region.toLowerCase().includes(query)));
    if (!matches.length) return "";
    return '<div class="section-label">'+region+'</div>'+matches.map(country=>{
      const count=recordsFor(country).length;
      const status=country.changes?"Open changes":count?"Sample coverage":"Not assessed";
      return '<button type="button" class="country-row" data-act="pick-country" data-value="'+country.id+'" aria-pressed="'+(currentCountry===country.id)+'"><span><strong>'+country.name+'</strong><small class="sub">'+status+'</small></span>'+icon("chevron")+'</button>';
    }).join("");
  }).join("");
  return groups||'<p class="nothing">No countries match this search.</p>';
}
function options(values,selected) {
  return values.map(([value,label])=>'<option value="'+esc(value)+'"'+(value===selected?" selected":"")+'>'+esc(label)+'</option>').join("");
}
function countryRequirements() {
  const country=countryById(currentCountry);

  const filtered=all.filter(record=>(countryTopic==="all"||record.topic===countryTopic) && (countryScope==="all"||(countryScope==="shared"?record.shared:!record.shared)));
  const hasLocal=all.some(record=>!record.shared);
  const coverage=hasLocal ? "Sample country coverage" : all.length ? "Shared EU coverage only" : "Not assessed";
  const links=[...(country.changes??[]),...(country.shared??[])].map(id=>{

  const coveredTopics=new Set(all.map(record=>record.topic));

    '<div class="card-foot"><div class="filters"><label class="field">Topic<select id="country-topic">'+options([["all","All topics"],...topics.map(topic=>[topic,topic])],countryTopic)+'</select></label><label class="field">Record scope<select id="country-scope">'+options([["all","All scopes"],["local","Country-specific"],["shared","Shared EU"]],countryScope)+'</select></label></div></div>'+

    '<form id="schedule-form"><label class="toggle"><input type="checkbox" name="enabled"'+(scheduleState.enabled?" checked":"")+'> Enable automatic replay</label><label class="field">Repeat every (days)<input type="number" name="days" min="1" max="365" step="1" value="'+scheduleState.days+'" required></label><div class="actions"><button type="submit" class="btn primary">Save schedule</button><button id="replay" type="button" class="btn" data-act="replay">'+icon("retry")+'Replay checks</button></div></form>'+

    '<section class="card"><div class="card-head"><div><h2>Run status</h2><p>Schedule times are shown in Athens time.</p></div></div><div class="settings">'+
    '<div id="run-status">'+runStatus()+'</div>'+

  if (!data.length) return '<p class="nothing">No pages match these filters.</p>';

function changeCard(compact) {
  const entries=changes.map(change=>'<button type="button" class="change" data-act="'+(compact?"select-change":"change-detail")+'" data-value="'+change.id+'"'+(compact?' aria-pressed="'+(currentChange===change.id)+'"':'')+'><span class="change-mark">'+icon("changes")+'</span><span><span class="change-top"><strong>'+change.title+'</strong>'+badge(change.status,change.tone)+'</span><small>'+change.scope+' · '+change.kind+' · '+change.when+'</small><span class="change-summary">'+change.summary+'</span></span>'+icon("chevron")+'</button>').join("");

  changes:()=>heading("Detected changes","Inspect a change, its source evidence and the inputs needed for study screening.")+changeCard(false),
  studies:()=>heading("Study impact","Explore the portfolio assessment or public matches for the selected change.")+
    '<div class="runbar"><label class="field">Regulatory change<select id="study-change">'+changes.map(change=>'<option value="'+change.id+'"'+(change.id===currentChange?' selected':'')+'>'+change.title+'</option>').join("")+'</select></label><div class="actions">'+trigger("View change evidence","change-detail",currentChange,"","file")+(currentChange==="uk"?'<a class="btn" href="./RegChain-AI-Prototype.html">Open approval demo '+icon("arrow")+'</a>':"")+'</div></div><div id="study-card">'+studyCard(false)+'</div>',
  research
};
function render() {shell();byId("view").innerHTML=views[page]();updateRun();}
function notify(text="") {byId("announce").textContent=text;}
function navigate(to,focus=true) {page=to;render();if(focus){byId("page-title").focus({preventScroll:true});window.scrollTo(0,0);}}
function factlist(facts) {
  return '<dl class="facts">'+facts.map(([label,value])=>'<div><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>').join("")+'</dl>';
}
function block(title,text) {return '<section class="drawer-block"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p></section>';}
function drawer(type,title,content) {
  const modal=byId("drawer");
  if (!modal.open) drawerOrigin=document.activeElement;
  byId("drawer-type").textContent=type;
  byId("drawer-title").textContent=title;
  byId("drawer-body").innerHTML=content;
  if (!modal.open) modal.showModal();
  modal.scrollTop=0;
  modal.querySelector(".close").focus();
}
function sourceDetail(id) {
  const source=sources.find(item=>item.id===id);
  drawer("Source check",source.title,badge(source.status,source.tone)+factlist([
    ["Authority",source.authority],["Scope",source.scope],["Check time",replayDate+" · "+source.checked+" UTC (replay)"],
    ["Source edition",source.edition],["Compared section",source.status==="Retry needed"?"Comparison pending":source.section]
  ])+block("Check result",source.result)+'<section><h3>Page URL</h3><a class="url" href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">'+esc(source.url)+'</a></section>'+
  (source.change?'<div>'+trigger("View related change","change-detail",source.change,"","arrow")+'</div>':""));
}
function changeDetail(id) {
  const change=changes.find(item=>item.id===id);
  drawer("Detected change",change.title,badge(change.status,change.tone)+factlist([["Authority",change.authority],["Scope",change.scope],["Date basis",change.when]])+
    block("Previous reference",change.before)+block("What changed",change.after)+block("Study data needed",change.need)+
    '<section><h3>Supporting sources</h3><div class="actions">'+change.evidence.map(id=>trigger(sources.find(source=>source.id===id).title,"source-detail",id,"","file")).join("")+'</div></section>'+
    '<div>'+trigger("View study impact","go-impact",id,"primary","arrow")+'</div>');
}
function studyDetail(id) {
  const isPublic=id.startsWith("NCT");
  const study=(isPublic?publicStudies:studies).find(item=>item.id===id);
  const change=selectedChange();
  if(isPublic) {
    drawer("ClinicalTrials.gov · public registry",study.title,badge("Candidate match","blue")+factlist([["Registry ID",study.id],["Sponsor",study.sponsor],["Listed locations",study.sites],["Registry status",study.status],["Last update posted",study.posted]])+
      block("Why it surfaced","The sample record lists a site in the jurisdiction screened for "+change.title+".")+
      block("Information needed to assess impact",change.need)+'<p>'+esc(registryCredit)+'</p><div>'+openLink("Open registry record",study.url,"primary")+'</div>');
  } else {
    drawer("Fictional portfolio",study.title,badge(study.status,study.tone)+factlist([["Study ID",study.id],["Location",study.sites],["Related change",change.title],["Batches",study.batches.join(", ")]])+
      block("Assessment",study.detail)+'<div>'+trigger("View change evidence","change-detail",change.id,"","file")+'</div>');
  }
}
function selectChange(id) {
  currentChange=id;
  studyView=studies.some(study=>study.changes.includes(id))?"portfolio":"registry";
}
function updateStudies() {byId("study-card").innerHTML=studyCard(page==="overview");}
function replay(reason="manual") {
  if (replaying) return;
  replaying=true;updateRun();notify("Replaying the six recorded checks.");
  window.setTimeout(()=>{
    scheduleState=readScheduleOrCurrent();
    if (reason==="scheduled" && (!scheduleState.enabled || scheduleState.nextAt>Date.now())) {
      replaying=false;
      updateRun();
      notify();
      return;
    }
    const now=Date.now();
    scheduleState.runCount++;
    scheduleState.lastAt=now;
    scheduleState.lastReason=reason;
    if (reason==="scheduled") {
      const interval=scheduleState.days*dayMs;
      scheduleState.nextAt+= (Math.floor((now-scheduleState.nextAt)/interval)+1)*interval;
    }
    storeSchedule();
    replaying=false;
    if (page==="overview" || page==="schedule") {
      const focused=byId("replay")===document.activeElement;
      if (!byId("schedule-form")?.contains(document.activeElement) || focused) {
        render();
        if(focused) byId("replay").focus();
      } else {
        byId("run-status").innerHTML=runStatus();
        updateRun();
      }
    }
    notify("Replay complete. Three changes detected. One source check needs retry.");
  },350);
}
function readScheduleOrCurrent() {
  try {return localStorage.getItem(scheduleKey)?readSchedule():scheduleState;}
  catch {return scheduleState;}
}
function checkDue() {
  scheduleState=readScheduleOrCurrent();
  if(scheduleState.enabled && scheduleState.nextAt<=Date.now() && !replaying) replay("scheduled");
}
function openCountry(id) {
  currentCountry=id;
  countrySearch="";
  countryTopic="all";
  countryScope="all";
  navigate("countries");
}
const actions={
  nav:to=>{notify();navigate(to);},
  metric:target=>{
    if(target==="retry-filter"){sourceFilter="Retry needed";sourceSearch="";navigate("sources");return;}
    if(target==="regions"){byId("regions-title").focus();byId("regions").scrollIntoView({block:"nearest"});return;}
    if(target==="studies") selectChange("uk");
    navigate(target);
  },
  replay:()=>replay(),
  "country-page":openCountry,
  "pick-country":id=>{
    currentCountry=id;
    countryTopic="all";
    countryScope="all";
    byId("country-list").innerHTML=countryList();
    byId("country-requirements").innerHTML=countryRequirements();
    const focusTarget=window.matchMedia("(max-width:760px)").matches?byId("country-topic"):byId("country-list").querySelector('[data-value="'+id+'"]');
    focusTarget.focus();
  },
  requirement:requirementDetail,
  "source-detail":sourceDetail,
  "change-detail":changeDetail,
  "study-detail":studyDetail,
  "select-change":id=>{
    selectChange(id);
    byId("view").querySelectorAll('[data-act="select-change"]').forEach(control=>control.setAttribute("aria-pressed",String(control.dataset.value===id)));
    byId("view").querySelector('[data-act="change-detail"]').dataset.value=id;
    updateStudies();
    byId("study-card").scrollIntoView({block:"nearest"});
    notify("Study impact updated for "+selectedChange().title+".");
  },
  "go-impact":id=>{byId("drawer").close();drawerOrigin=null;selectChange(id);navigate("studies");},
  "study-view":tab=>{studyView=tab;updateStudies();byId("study-card").querySelector('[data-value="'+tab+'"]').focus();notify(tab==="registry"?"Showing public registry candidates.":"Showing the fictional portfolio assessment.");}
};
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-act]");
  if(target && !target.disabled) actions[target.dataset.act](target.dataset.value);
});
document.addEventListener("input",event=>{
  if(event.target.id==="source-search"){
    sourceSearch=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches),false);
  }
  if (event.target.id==="country-search") {
    countrySearch=event.target.value;
    byId("country-list").innerHTML=countryList();
  }
});
document.addEventListener("change",event=>{
  if(event.target.id==="source-filter"){
    sourceFilter=event.target.value;
    byId("source-results").innerHTML=sourceTable(sources.filter(tableMatches),false);
  }
  if(event.target.id==="study-change"){
    selectChange(event.target.value);
    render();
    byId("study-change").focus();
  }
  if (event.target.id==="country-topic" || event.target.id==="country-scope") {
    const {id,value}=event.target;
    if(id==="country-topic") countryTopic=value;
    else countryScope=value;
    byId("country-requirements").innerHTML=countryRequirements();
    byId(id).focus();
  }
});
document.addEventListener("toggle",event=>{
  const region=event.target.dataset?.region;
  if (!region || !event.target.isConnected) return;
  if(event.target.open) expandedRegions.add(region);
  else expandedRegions.delete(region);
},true);
document.addEventListener("submit",event=>{
  if(event.target.id!=="schedule-form") return;
  event.preventDefault();
  scheduleState=readScheduleOrCurrent();
  const {enabled,days}=event.target.elements;
  const interval=Number(days.value);
  if(!Number.isInteger(interval)||interval<1||interval>365) return;
  const keepNext=scheduleState.enabled && scheduleState.days===interval;
  scheduleState={...scheduleState,enabled:enabled.checked,days:interval,
    nextAt:enabled.checked?(keepNext?scheduleState.nextAt:Date.now()+interval*dayMs):null};
  const saved=storeSchedule();
  render();
  byId("schedule-form").querySelector('button[type="submit"]').focus();
  notify(saved?"Schedule saved.": "Schedule applies to this tab. Browser storage is unavailable.");
  checkDue();
});
byId("drawer").addEventListener("close",()=>{if(drawerOrigin?.isConnected) drawerOrigin.focus();drawerOrigin=null;});
render();
checkDue();
window.setInterval(checkDue,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkDue();});
</script>
</body>
</html>
