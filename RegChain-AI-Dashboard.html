function sectionTrials(id) {

// Where a requirement comes from: the specification in force, or a change that is still waiting for approval.
function requirementBasis(countryId,section,caseId) {
  const spec=specFor(countryId);
  const where=specCountryName(countryId)+" specification v"+spec.version+" · "+specSectionNames[section];
  if(!caseId || workflows[caseId].publication) return {basis:where,pending:false};
  return {basis:"Pending change "+governedCases[caseId].id+" · "+specSectionNames[section]+". Specification v"+spec.version+" does not say this yet.",pending:true};
}
function check(countryId,section,requirement,result,detail,caseId) {
  return {section,requirement,result,detail,...requirementBasis(countryId,section,caseId)};
}
// A requirement whose data is not connected yet.
function notChecked(countryId,section,requirement,why) {
  return {section,requirement,result:"Not checked",detail:why,basis:specFor(countryId)?specCountryName(countryId)+" specification · "+specSectionNames[section]:"No specification",pending:false};

function preparationCheck(countryId,prepareBy,basisNote) {

    isWeekend(prepareBy)?"Prepare by "+weekdayName(prepareBy)+" "+displayDay(prepareBy)+"; move it to the working day before.":"Prepare by "+displayDay(prepareBy)+", in "+days+" days.";
  return {section:"logistics",requirement:basisNote,result,detail,basis:"Supply plan and "+specCountryName(countryId)+" specification · Logistics constraints",pending:false};

    const offDay=code==="IL"?isIsraeliWeekend(item.delivery):isWeekend(item.delivery);

      "Delivery on "+weekdayName(item.delivery)+" "+displayDay(item.delivery)+(offDay?(code==="IL"?": Israeli sites do not receive on Friday or Saturday.":", a weekend day."):".")));
    const approved=(countrySpecs[countryId]?.sections.carriers?.items??[]).some(entry=>entry.startsWith(item.carrier));

    return {id:item.id,countryId,site:site.city,hospital:site.hospital,dispatch:item.dispatch,delivery:item.delivery,prepareBy,batch:item.batch,carrier:item.carrier,patients:site.patients,

// The shared booklet splits: who each batch can still serve once the rule applies, against what Israel needs.
function israelLabelPool() {
  if(!israel) return null;
  const {trial,operations}=israel;
  const effective=israel.case.effective;
  const batches=trial.batches.map(batch=>{
    const label=trial.labels.find(entry=>entry.id===batch.label);
    const shared=label.countries.length>1;
    return {...batch,labelSpec:label,kits:operations.depotStock[batch.id]??0,shared,
      serves:shared?"Greece and Cyprus. Israel only for kits imported before "+displayDay(effective):"Israel"};
  });
  const israeli=israelShipmentChecks().filter(item=>item.countryId==="il");
  const after=israeli.filter(item=>item.delivery>=effective);
  return {batches,effective,
    sharedKits:batches.filter(batch=>batch.shared).reduce((sum,batch)=>sum+batch.kits,0),
    israelOnlyKits:batches.filter(batch=>!batch.shared).reduce((sum,batch)=>sum+batch.kits,0),
    needed:after.reduce((sum,item)=>sum+(trial.shipments.find(entry=>entry.id===item.id)?.kits??0),0),
    // labelResult: under the label rule alone, for the change's own impact; result: everything, as on Shipments.
    israeli:israeli.map(item=>{const full=withClinRadarChecks(item);return {...full,result:shipmentResult(full),labelResult:shipmentResult(item)};}),after};
}

function plannedShipments() {

function attention(shipment) {

  const issues=shipment.checks.filter(item=>blocking.includes(item.result)||item.result==="Confirm").length;
  if(!first) return "All connected checks pass.";
  const more=issues>1?" (+"+(issues-1)+" more)":"";
  // External risk in a few words: the full evidence is on the shipment's page.
  const match=first.section==="risk"&&first.signal?(ss?.byShipment?.[shipment.id]??[]).find(entry=>entry.signal===first.signal):null;
  if(match) return "External risk: the "+lowerFirst(match.label)+" on "+displayDay(match.date)+(match.evidence?" is "+match.evidence.status+" ("+match.evidence.source+")":", not confirmed by the "+(match.leg==="collection"?"depot":"courier")+" yet")+"."+more;
  // One specific reason: skip a short status phrase ("Labeling review required.") when a concrete sentence follows.
  const sentences=String(first.detail).split(/(?<=\.)\s+/);

  return (first.section==="regulatory"?"":specSectionNames[first.section]+": ")+reason+more;

    case "tool_result": return event.tool==="verify_option"?["The ClinRadar verifier answers",teamVerdict(event.text)]:event.tool==="create_draft"?["The Draft inbox keeps the draft",teamAnswer(event.text)]:[systemName(event.system)+" answers",teamAnswer(event.text)];

function teamTally(events) {
  const agents=Object.fromEntries(["orchestrator",...teamWatch,...teamSpecialists].map(id=>[id,{tasks:0,calls:0,reports:0,drafts:0,checks:0,teams:0,last:null}]));
  const systems=Object.fromEntries(teamSystems.map(([name])=>[name,0]));
  const shipments=new Set();
  for(const event of events) {
    if(event.shipment) shipments.add(event.shipment);
    const actor=agents[teamActor(event)]??agents.orchestrator;
    if(event.type==="delegate"&&agents[event.to]) agents[event.to].tasks++;
    if(event.type==="delegate_shipment") agents.orchestrator.teams++;
    if(event.type==="tool_call") {
      if(event.tool==="verify_option") agents.verifier.checks++;
      else {agents[event.agent]&&agents[event.agent].calls++;if(systemName(event.system) in systems) systems[systemName(event.system)]++;}
    }
    if(event.type==="report") actor.reports++;
    if(event.type==="draft"||(event.type==="tool_call"&&event.tool==="create_draft")) agents.orchestrator.drafts++;
    if(["allocation","warning"].includes(event.type)) agents.verifier.checks++;
    if(event.type!=="tool_result") actor.last=event;
  }
  agents.orchestrator.drafts=Math.max(agents.orchestrator.drafts,0);
  return {agents,systems,shipments};
}

// The line for the current step, drawn between the two cards it connects, with a dot travelling along it.
function teamEdges(route) {
  const board=byId("team-board");
  const svg=byId("team-edges");
  if(!board||!svg) return;
  const box=board.getBoundingClientRect();
  svg.setAttribute("viewBox","0 0 "+Math.round(box.width)+" "+Math.round(box.height));
  const center=(id,side)=>{
    const node=board.querySelector('[data-node="'+CSS.escape(id)+'"]');
    if(!node) return null;
    const rect=node.getBoundingClientRect();
    return {x:rect.left-box.left+rect.width/2,y:side==="top"?rect.top-box.top:side==="bottom"?rect.bottom-box.top:rect.top-box.top+rect.height/2};
  };
  const master=center("orchestrator","bottom");
  let lines=teamSpecialists.map(id=>{const to=center(id,"top");return master&&to?'<path class="edge" d="M'+master.x+' '+master.y+' C'+master.x+' '+(master.y+28)+' '+to.x+' '+(to.y-28)+' '+to.x+' '+to.y+'"/>':"";}).join(""); const masterTop=center("orchestrator","top"); lines+=teamWatch.map(id=>{const from=center(id,"bottom");return masterTop&&from?'<path class="edge" d="M'+from.x+' '+from.y+' C'+from.x+' '+(from.y+24)+' '+masterTop.x+' '+(masterTop.y-24)+' '+masterTop.x+' '+masterTop.y+'"/>':"";}).join("");
  const [from,to]=route;
  if(from&&to&&from!==to) {
    const a=center(from),b=center(to);
    if(a&&b) {
      lines+='<path class="edge live" d="M'+a.x+' '+a.y+' L'+b.x+' '+b.y+'"/>';
      svg.innerHTML=lines;
      if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
        dot.setAttribute("r","6");dot.setAttribute("class","edge-dot");
        svg.appendChild(dot);
        dot.animate([{transform:"translate("+a.x+"px,"+a.y+"px)"},{transform:"translate("+b.x+"px,"+b.y+"px)"}],{duration:Math.max(220,700/teamSpeed*2),easing:"ease-in-out",fill:"forwards"});
      }
      return;
    }
  }
  svg.innerHTML=lines;
}

function policyRows(config) {

// Depots, factories and signals that would sit on another marker are moved apart a few pixels, so each stays visible and

function mapSpread(marks,s) {
  for(const item of marks) item.at=item.xy;
  const movable=marks.filter(item=>["facility","signal","airport"].includes(item.type));
  const size=item=>item.type==="facility"||item.type==="signal"||item.type==="airport"?9:item.r+(item.type==="cluster"?4:2);
  for(let pass=0;pass<4;pass++) for(const a of movable) for(const b of marks) {

    const need=size(a)+size(b)+2;

  }
  for(const item of movable) {
    const dx=(item.at[0]-item.xy[0])*s,dy=(item.at[1]-item.xy[1])*s,d=Math.hypot(dx,dy);

// Run the check: the official sources and, served, the live feeds for every country monitored for external risk.
async function replay(reason="manual") {

  if (reason==="scheduled") {scheduleState=readScheduleOrCurrent();if(!scheduleState.enabled||scheduleState.nextAt>Date.now()) return;}
  replaying=true;updateRun();
  const feeds=serverMode()&&ssDetermined();
  notify(feeds?"Running the check: the official sources and the live feeds for the monitored countries.":"Running "+sources.length+" source checks.");
  let problem="";
  let checked=null;
  if(feeds) {try {const reply=await agentPost("/api/supplyshield/check",{});checked=reply.check??null;adoptClinRadar(reply);} catch(error) {problem=error.message;}}
  else await pause(350);
  scheduleState=readScheduleOrCurrent();
  const now=Date.now();
  scheduleState.runCount++;
  scheduleState.lastAt=now;
  scheduleState.lastReason=reason;
  if (reason==="scheduled") scheduleState.nextAt=nextCheckAt(scheduleState,now,scheduleState.frequency==="interval"?scheduleState.nextAt:null);
  storeSchedule();
  replaying=false;
  if (["overview","settings","signals"].includes(page)) {
    const focused=byId("replay")===document.activeElement;
    if (!byId("schedule-form")?.contains(document.activeElement) || focused) {
      render();
      if(focused) byId("replay")?.focus();
    } else {
      byId("run-status").innerHTML=runStatus();
      updateRun();
    }
  } else updateRun();
  const counts=ssDetermined()?signalCounts():null;
  const raised=checked?.alerts?.raised??0;
  const sentTo=(checked?.alerts?.deliveries??[]).filter(item=>item.status==="sent").map(item=>item.channel==="email"?"by email":"to the chat webhook");
  notify((problem?"The check did not complete ("+problem+"), so the last good copy is used. ":"")+"Check complete."+
    (counts?" "+plural(counts.confirmed,"confirmed disruption")+", "+plural(counts.potential,"potential exposure")+", "+plural(counts.observed,"observed event")+".":"")+
    (checked?(raised?" "+plural(raised,"new alert")+" for Clinical Supply"+(sentTo.length?", sent "+sentTo.join(" and "):", shown here")+".":" No new alert."):"")+
    (checked?.regulatory?.changed?.length?" "+plural(checked.regulatory.changed.length,"regulatory source")+" changed.":"")+
    (feeds?"":" "+(retryCount()===0?"No source check needs a retry.":retryCount()===1?"One source check needs a retry.":retryCount()+" source checks need a retry.")));
  afterCheck();
}

async function askServerSchedule() {

    const status=await aiRequest("/api/scheduler");
    const known=ss?.scheduler;
    if(!status.on||!known||(status.lastPollAt===known.lastPollAt&&status.lastCheck?.at===known.lastCheck?.at&&status.lastRegulatoryAt===known.lastRegulatoryAt)) return;
    const scheduled=status.lastCheck&&status.lastCheck.at!==known.lastCheck?.at&&status.lastCheck.reason==="scheduled";
    const before=ss?.alerts?.counts?.open??0;
    await loadClinRadar(true);
    if(page==="settings"&&!byId("view")?.querySelector("form")?.contains(document.activeElement)) render();

}

// ---------- Dropdowns ----------
// Every <select> gets a button and a list in the page's own style, with search on long lists and group headings.
// The select stays in the page, hidden: it still holds the value and fires "change", so forms and listeners work unchanged.
const ddPop=document.createElement("div");
ddPop.id="dd-pop";
document.body.appendChild(ddPop);
let ddSelect=null,ddActive=-1,ddItems=[];
const ddButton = select => select?.parentNode?.querySelector(":scope > .dd-btn");
const ddLabel = select => String(select.closest("label")?.childNodes[0]?.textContent??select.getAttribute("aria-label")??"").trim();
function ddText(text) {
  const parts=String(text).split(" · ");
  return parts.length>1&&parts[0].length<=16?'<b>'+esc(parts[0])+'</b><small>'+esc(parts.slice(1).join(" · "))+'</small>':esc(text);
}
function ddSync(select) {
  const button=ddButton(select);
  if(!button) return;
  const option=select.options[select.selectedIndex];
  button.innerHTML='<span class="dd-value">'+(option?ddText(option.text):"")+'</span>';
  button.disabled=select.disabled;
  const label=ddLabel(select);
  button.setAttribute("aria-label",(label?label+": ":"")+(option?.text??""));
}
function enhanceSelects(root=document) {
  for(const select of root.querySelectorAll("select:not([data-dd])")) {
    select.dataset.dd="1";
    const wrap=document.createElement("span");
    wrap.className="dd";
    select.before(wrap);
    const button=document.createElement("button");
    button.type="button";
    button.className="dd-btn";
    button.setAttribute("aria-haspopup","listbox");
    button.setAttribute("aria-expanded","false");
    wrap.append(button,select);
    select.classList.add("dd-native");
    select.tabIndex=-1;
    ddSync(select);
  }
}
const nativeSelectFocus=HTMLSelectElement.prototype.focus;
HTMLSelectElement.prototype.focus=function(options) {
  if(!this.dataset.dd&&this.isConnected&&this.parentNode) enhanceSelects(this.parentNode);
  const button=ddButton(this);
  return button?button.focus(options):nativeSelectFocus.call(this,options);
};
function ddMark() {
  for(const item of ddPop.querySelectorAll(".dd-opt")) item.classList.toggle("active",Number(item.dataset.i)===ddActive);
  ddPop.querySelector(".dd-opt.active")?.scrollIntoView({block:"nearest"});
}
function ddFill(query) {
  const q=query.trim().toLowerCase();
  let html="";
  ddItems=[];
  const add=option=>{
    if(q&&!option.text.toLowerCase().includes(q)) return;
    html+='<li class="dd-opt" role="option" data-i="'+ddItems.length+'" aria-selected="'+option.selected+'"'+(option.disabled?' aria-disabled="true"':'')+'>'+ddText(option.text)+'</li>';
    ddItems.push(option);
  };
  for(const child of ddSelect.children) {
    if(child.tagName==="OPTGROUP") {
      const mark=html.length,count=ddItems.length;
      html+='<li class="dd-group" role="presentation">'+esc(child.label)+'</li>';
      for(const option of child.children) add(option);
      if(ddItems.length===count) html=html.slice(0,mark);
    } else if(child.tagName==="OPTION") add(child);
  }
  ddPop.querySelector("ul").innerHTML=html||'<li class="dd-empty">Nothing matches</li>';
  ddActive=Math.max(0,ddItems.findIndex(option=>option.selected));
  ddMark();
}
function ddPlace(button) {
  const rect=button.getBoundingClientRect();
  const width=Math.min(Math.max(rect.width,240),innerWidth-16);
  const below=innerHeight-rect.bottom-12,above=rect.top-12;
  const up=below<260&&above>below;
  ddPop.style.width=width+"px";
  ddPop.style.left=Math.max(8,Math.min(rect.left,innerWidth-width-8))+"px";
  ddPop.style.top=up?"auto":(rect.bottom+6)+"px";
  ddPop.style.bottom=up?(innerHeight-rect.top+6)+"px":"auto";
  ddPop.style.maxHeight=Math.min(380,up?above:below)+"px";
}
function ddOpen(select) {
  ddClose(false);
  if(select.disabled) return;
  ddSelect=select;
  const button=ddButton(select);
  button.setAttribute("aria-expanded","true");
  const searchable=select.options.length>8;
  ddPop.innerHTML=(searchable?'<input class="dd-search" type="search" placeholder="Search" aria-label="Search the list" autocomplete="off">':"")+'<ul role="listbox" tabindex="-1" aria-label="'+esc(ddLabel(select)||"Choose")+'"></ul>';
  ddFill("");
  ddPop.classList.add("on");
  ddPlace(button);
  (ddPop.querySelector(".dd-search")??ddPop.querySelector("ul")).focus({preventScroll:true});
}
function ddClose(refocus) {
  if(!ddSelect) return;
  const button=ddButton(ddSelect);
  button?.setAttribute("aria-expanded","false");
  ddPop.classList.remove("on");
  ddPop.innerHTML="";
  ddSelect=null;
  if(refocus) button?.focus();
}
function ddChoose(index) {
  const option=ddItems[index];
  if(!option||option.disabled) return;
  const select=ddSelect;
  ddClose(true);
  if(select.value===option.value) return;
  select.value=option.value;
  ddSync(select);
  select.dispatchEvent(new Event("change",{bubbles:true}));
  if(select.id&&!select.isConnected) setTimeout(()=>ddButton(byId(select.id))?.focus(),0);
}
function ddMove(step) {
  const count=ddItems.length;
  if(!count) return;
  let index=ddActive;
  for(let tries=0;tries<count;tries++) {index=(index+step+count)%count;if(!ddItems[index].disabled) break;}
  ddActive=index;
  ddMark();
}
document.addEventListener("click",event=>{
  const button=event.target.closest?.(".dd-btn");
  if(button) {const select=button.parentNode.querySelector("select");if(ddSelect===select) ddClose(true); else ddOpen(select);return;}
  const option=event.target.closest?.("#dd-pop .dd-opt");
  if(option) {ddChoose(Number(option.dataset.i));return;}
  if(ddSelect&&!event.target.closest?.("#dd-pop")) ddClose(false);
},true);
document.addEventListener("keydown",event=>{
  const button=event.target.closest?.(".dd-btn");
  if(button&&!ddSelect&&["ArrowDown","ArrowUp","Enter"," "].includes(event.key)) {event.preventDefault();ddOpen(button.parentNode.querySelector("select"));return;}
  if(!ddSelect||!event.target.closest?.("#dd-pop,.dd-btn")) return;
  if(event.key==="ArrowDown"||event.key==="ArrowUp") {event.preventDefault();ddMove(event.key==="ArrowDown"?1:-1);}
  else if(event.key==="Enter") {event.preventDefault();ddChoose(ddActive);}
  else if(event.key==="Escape") {event.preventDefault();ddClose(true);}

},true);
ddPop.addEventListener("input",event=>{if(event.target.classList.contains("dd-search")) ddFill(event.target.value);});
// Only a change of width closes the list: on phones the keyboard changes the height when the search box gets focus.
let ddWidth=innerWidth;
window.addEventListener("resize",()=>{if(innerWidth!==ddWidth) {ddWidth=innerWidth;ddClose(false);} else if(ddSelect) ddPlace(ddButton(ddSelect));});
document.addEventListener("scroll",event=>{if(ddSelect&&!ddPop.contains(event.target)) ddClose(false);},true);

  if(!serverMode()) return;
  const next={...manualShipmentActions};
  for(const [id,approval] of Object.entries(agentApprovals)) next[id]={action:approval.option==="escalate"?"escalated":"plan",reason:approval.option==="escalate"?"Escalated: no option passes the rules.":"Agent plan approved: "+approval.title,by:approval.by,at:approval.at};
  shipmentActions=next;
}
async function loadServerState() {
  if(!serverMode()) return;
  try {
    const [session,cases,actions,decisions]=await Promise.all([aiRequest("/v1/session"),aiRequest("/v1/cases"),aiRequest("/v1/shipment-actions"),aiRequest("/v1/change-decisions")]);
    signedInUser=session.mode==="password"?session.user:null;
    serverAuthMode=session.mode;
    if(session.role) workflowRole=session.role;
    else if(session.mode!=="password") await apiWrite("POST","/v1/session",{role:workflowRole});
    for(const item of cases.cases) setWorkflow(item.workflow);
    manualShipmentActions=actions.actions??{};
    changeDecisions=decisions.decisions??{};
    composeShipmentActions();
    render();
  } catch(error) {
    notify("ClinRadar's server did not answer: "+error.message);
  }
}
render();
loadClinRadar();
loadServerState().then(loadAi);
checkDue();
window.setInterval(checkDue,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkDue();});
</script>
</body>
