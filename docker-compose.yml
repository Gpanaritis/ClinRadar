# One RegChain instance with its data in a named volume. Only this computer reaches port 4173: put an HTTPS reverse
# proxy (for example Caddy or nginx) in front, and set REGCHAIN_PUBLIC_ORIGIN to the address people open.
services:
  regchain:
    build:
      context: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      # REGCHAIN_PUBLIC_ORIGIN: "https://regchain.your-company.example"
      # REGCHAIN_TRUST_PROXY: "1"
      REGCHAIN_AI_PROVIDER: ${REGCHAIN_AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REGCHAIN_MODEL_ORCHESTRATOR: ${REGCHAIN_MODEL_ORCHESTRATOR:-gemini-3.8-flash}
      REGCHAIN_MODEL_SPECIALIST: ${REGCHAIN_MODEL_SPECIALIST:-gemini-3.8-flash}
      REGCHAIN_MODEL_WATCH: ${REGCHAIN_MODEL_WATCH:-gemini-3.5-flash-lite}
      REGCHAIN_MODEL_AI_CHECK: ${REGCHAIN_MODEL_AI_CHECK:-gemini-3.8-flash}
    volumes:
      - regchain-data:/data
    restart: unless-stopped
volumes:
  regchain-data: {}
