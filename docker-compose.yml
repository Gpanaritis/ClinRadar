# One RegChain instance with its data in a named volume. Only this computer reaches port 4173: put an HTTPS reverse
# proxy (for example Caddy or nginx) in front, and set REGCHAIN_PUBLIC_ORIGIN to the address people open.
services:
  regchain:
    build:
      context: .
      args:
        # For a Claude service other than Anthropic's own API, its package (RegChain-AI-Deployment.md, "Which Claude service").
        REGCHAIN_AI_PACKAGES: ${REGCHAIN_AI_PACKAGES:-}
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      # REGCHAIN_PUBLIC_ORIGIN: "https://regchain.your-company.example"
      # REGCHAIN_TRUST_PROXY: "1"
      REGCHAIN_AI_PROVIDER: ${REGCHAIN_AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Encrypts a Claude key an administrator connects in Settings. Unset, a key is generated in the /data volume, next to
      # the encrypted key. 32 random bytes, base64: openssl rand -base64 32
      REGCHAIN_SECRET_KEY: ${REGCHAIN_SECRET_KEY:-}
      # For a cloud service, add its settings, for example Amazon Bedrock:
      # AWS_REGION: "eu-central-1"
      # and give the container the cloud identity that may call Claude (an IAM role, a service account, a managed identity).
    volumes:
      - regchain-data:/data
    restart: unless-stopped
volumes:
  regchain-data: {}
