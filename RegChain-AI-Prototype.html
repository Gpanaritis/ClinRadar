.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}th{color:var(--muted);font-size:11px;white-space:nowrap;background:#fafaf7;font-weight:700}th,td{padding:10px 12px;vertical-align:middle;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8faf7}.empty{padding:22px}
tbody tr:has([aria-pressed="true"]){background:#edf4ed}tbody tr:has([aria-pressed="true"]) td:first-child{box-shadow:inset 3px 0 #447259}
select,input[type=date],textarea{border:1px solid #d6dbd4;border-radius:7px;background:#fff;color:var(--ink);padding:7px 9px}textarea{resize:vertical;min-height:83px;width:100%;line-height:1.45}.field{display:grid;gap:6px;font-weight:650}.field span{font-size:12px}.field-group{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.basis{display:grid;gap:7px;margin:10px 0 0;padding:0;list-style:none}.basis li{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.2fr);gap:8px;border-top:1px solid var(--line);padding-top:7px}.basis span:first-child{color:var(--muted);font-size:12px}
.timeline{list-style:none;margin:0;padding:5px 15px}.timeline li{position:relative;display:grid;grid-template-columns:17px minmax(0,1fr);gap:7px;padding:9px 0}.timeline li+li{border-top:1px solid var(--line)}.timeline .icon{color:#467357;margin-top:1px}.timeline strong,.timeline small{display:block}.timeline small{color:var(--muted);margin-top:2px}.flow-table td:first-child{font-weight:650}.flow-table td{line-height:1.45}.flow-table th:nth-child(1){min-width:108px}.flow-table th:nth-child(2){min-width:135px}.flow-table th:nth-child(3){min-width:215px}
.notice{margin-top:12px;min-height:20px;color:var(--green);font-weight:650}.notice:empty{display:none}dialog{padding:0;border:1px solid var(--line);border-radius:12px;max-width:560px;width:calc(100% - 26px);box-shadow:var(--shadow);color:var(--ink);margin:auto}dialog::backdrop{background:#1c2925a3}dialog .pad{display:grid;gap:13px}dialog h2{margin:0;font-size:19px}dialog p{margin:0;line-height:1.55}.dialog-close{font-size:18px;padding:0 10px}.footnote{margin-top:16px;font-size:12px;color:var(--muted)}
@media(max-width:1050px){.shell{grid-template-columns:183px minmax(0,1fr)}.content,.topbar{padding-left:22px;padding-right:22px}.split.impact{grid-template-columns:minmax(0,1fr)}}

@media(max-width:505px){.content,.topbar{padding-left:12px;padding-right:12px}.topbar{align-items:flex-start;flex-direction:column}.content{padding-top:15px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step{padding:9px}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}header.case{padding:16px}.pair{grid-template-columns:1fr}.pair>div+div{border-left:0;border-top:1px solid var(--line)}.stat{padding:10px}.stat span{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}[hidden]{display:none!important}

<body>
<div class="shell">
  <aside class="rail" aria-label="RegChain navigation">
    <div class="brand"><span class="logo" aria-hidden="true">R</span>RegChain AI</div>
    <nav id="navigation" aria-label="Workspace pages"></nav>
    <div class="rail-bottom"><div><strong>Demo workspace</strong><br>Fictional sponsor portfolio</div><button type="button" class="reset" data-act="reset">Reset demo</button></div>
  </aside>
  <div class="viewport">
    <div class="topbar"><div class="crumb">Workspace <span aria-hidden="true">/</span> <strong id="breadcrumb"></strong></div><div class="top-controls"><label for="persona" class="small muted">Demo role</label><select class="persona" id="persona"><option value="reviewer">Regulatory SME</option><option value="owner">Quality action owner</option><option value="viewer">Clinical Supply viewer</option></select></div></div>
    <main class="content" id="main">
      <div id="case-header"></div>
      <div id="progress" class="steps" aria-label="Case progress"></div>
      <div id="screen"></div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </main>
  </div>
</div>
<dialog id="detail" aria-labelledby="dialog-title"><div class="head"><h2 id="dialog-title"></h2><form method="dialog"><button class="btn dialog-close" aria-label="Close">×</button></form></div><div id="dialog-body" class="pad"></div></dialog>
<script id="demo-model">
"use strict";
const evidence = [
  {id:"EV-01", title:"Part 7 replacement and commencement", kind:"UK legislation", locator:"S.I. 2025/538 · regulations 1 and 32", summary:"The amendment substitutes Part 7 of the Clinical Trials Regulations. Its commencement falls on 28 April 2026.", url:"https://www.legislation.gov.uk/uksi/2025/538/pdfs/uksi_20250538_en.pdf"},
  {id:"EV-02", title:"Saved labeling rules for qualifying IMPs", kind:"UK legislation", locator:"Schedule 14 · paragraphs 1, 2 and 6", summary:"The legacy provision can continue for qualifying IMPs made before the relevant day, labeled under the old rules and used in their intended old-rules trial.", url:"https://www.legislation.gov.uk/uksi/2025/538/pdfs/uksi_20250538_en.pdf"},
  {id:"EV-03", title:"Finished-IMP QP certification date", kind:"MHRA guidance", locator:"Transitional arrangements · labeling of IMPs", summary:"MHRA guidance uses the finished IMP’s QP batch certification date as the date of manufacture for this labeling transition.", url:"https://www.gov.uk/guidance/clinical-trials-for-medicines-clinical-trials-regulations-transitional-arrangements#transitional-arrangements-for-labelling-of-investigational-medicinal-products"},
  {id:"EV-04", title:"Earlier consolidated Part 7", kind:"UK legislation", locator:"S.I. 2004/1031 · earlier edition · regulation 46", summary:"The earlier regulation 46 is the reference used by the fictional baseline country record.", url:"https://www.legislation.gov.uk/cy/uksi/2004/1031/body/2025-07-23"}
];
const baseline = "Use the earlier UK Part 7 labeling reference in the country record for the legacy cohort.";
const candidate = "Reference amended UK Part 7 from 28 April 2026. Retain the earlier rules for qualifying batches under Schedule 14, paragraph 6.";
const cutoff = "2026-04-28";
const caseId = "RC-UK-001";
const batches = [
  {id:"A-101", study:"STUDY-001", country:"UK", qp:"2026-04-20", label:"LBL-UK-v1", cohort:"Old rules", intended:true, oldLabel:true},
  {id:"B-102", study:"STUDY-003", country:"UK", qp:"2026-05-05", physical:"2026-04-20", label:"LBL-UK-v1", cohort:"New rules"},
  {id:"C-103", study:"STUDY-003", country:"UK", qp:"2026-05-05", label:"LBL-UK-v2", cohort:"New rules"},
  {id:"D-104", study:"STUDY-001", country:"UK", qp:null, label:"LBL-UK-v1", cohort:"Old rules"},
  {id:"E-105", study:"STUDY-002", country:"Germany", qp:"2026-05-05", label:"LBL-DE-v1", cohort:"Outside UK"},
  {id:"F-106", study:"STUDY-003", country:"UK", qp:cutoff, label:"LBL-UK-v1", cohort:"New rules"}
];
const results = {
  transition:["Potential transition eligibility","blue"], labeling:["Labeling review required","warm"],
  verify:["Verify specification and approvals","blue"], review:["Needs review","warm"], excluded:["Out of scope",""]
};
function assess(batch) {
  if (batch.country === "Germany") return ["excluded","Germany-only study and batch with no UK linkage.",["EV-01"]];
  const missing = [!batch.country && "UK scope", !batch.qp && "finished-IMP QP certification date", !batch.label && "label specification", batch.variation && "applicable variation"].filter(Boolean);
  if (missing.length) return ["review","Confirm "+missing.join(", ")+" before disposition.",["EV-02","EV-03"]];
  if (batch.qp === cutoff) return ["review","QP certification falls on the cutoff. The prototype routes the boundary case to an SME.",["EV-01","EV-02","EV-03"]];
  if (batch.qp < cutoff) {
    if (batch.cohort === "Old rules" && batch.intended && batch.oldLabel) return ["transition","Pre-cutoff QP date, legacy labeling evidence and intended use in the old-rules trial support review of the transition.",["EV-02","EV-03"]];
    return ["review","Confirm the trial cohort, intended use and old-rules label evidence.",["EV-02","EV-03"]];
  }
  if (batch.label === "LBL-UK-v1") return ["labeling","Finished-IMP QP certification is post-cutoff and the label is from the legacy specification. Review under amended Part 7.",["EV-01","EV-03"]];
  return ["verify","Review the updated specification and its approvals against amended Part 7.",["EV-01","EV-03"]];
}
const findings = batches.map(batch => {
  const [outcome, reason, evidenceIds] = assess(batch);
  return {...batch,outcome,reason,evidenceIds};
});
const inScope = findings.filter(batch => batch.outcome !== "excluded");
const labels = {
  "regulatory_change.detected":"Prepared source comparison replayed",
  "impact_assessment.prepared":"Fictional portfolio assessed",
  "expert_review.requested":"Proposal sent to SME review",
  "requirement_version.approved":"Country record update approved",
  "country_intelligence.updated":"Country record v2 published locally",
  "downstream_action.required":"Mock Quality task created",
  "downstream_action.acknowledged":"Quality owner acknowledged task",
  "proposal.rejected":"Proposal rejected",
  "proposal.investigation_requested":"Further investigation requested"
};
const roles = {reviewer:"Regulatory SME", owner:"Quality action owner", viewer:"Clinical Supply viewer", replay:"Fixture replay"};
function newState() {
  return {schema:1, scenario:"material", decision:null, action:null, events:[], observation:null};
}
function addEvent(state,type,actor,time,data) {
  const previous = state.events.at(-1);
  state.events.push({
    event_id:"rc-uk-001-" + String(state.events.length + 1).padStart(3,"0"), type, schema_version:1,
    occurred_at:time, producer:"regchain-demo", tenant_id:"fictional-sponsor",
    aggregate_type:"change_case", aggregate_id:caseId, aggregate_version:state.events.length+1,
    correlation_id:caseId, causation_id:previous?.event_id ?? null, actor,
    source_refs:["uk-amendment","mhra-labeling-transition"], evidence_ids:["EV-01","EV-02","EV-03"], data
  });
}
function replay(state,scenario,time) {
  state.scenario = scenario;
  state.observation = {scenario,time};
  if (scenario !== "material" || state.events.length) return;
  addEvent(state,"regulatory_change.detected","replay",time,{topic:"GB/IMP_LABELING",mode:"prepared"});
  addEvent(state,"impact_assessment.prepared","replay",time,{assessment_id:"ASMT-01",in_scope_batch_ids:inScope.map(batch=>batch.id)});
  addEvent(state,"expert_review.requested","replay",time,{proposal_id:"PROP-01",revision:1,base_version_id:"GB-IMP-v1"});
}
function decide(state,role,outcome,reason,time) {
  if (role !== "reviewer") return "Switch to Regulatory SME to record a decision.";
  if (state.scenario !== "material" || !state.events.length) return "Replay the official change first.";
  if (state.decision) return "A decision is already recorded for this proposal.";
  if (!["approved","rejected","investigation"].includes(outcome)) return "Choose a supported decision.";
  if (!reason.trim()) return "Enter the review rationale.";
  state.decision = {id:"DEC-01",outcome,reason:reason.trim(),time,actor:role,revision:1};
  const decisionData = {proposal_id:"PROP-01",decision_id:"DEC-01",revision:1,rationale:reason.trim()};
  if (outcome === "approved") {
    addEvent(state,"requirement_version.approved",role,time,decisionData);
    addEvent(state,"country_intelligence.updated","replay",time,{decision_id:"DEC-01",previous_version_id:"GB-IMP-v1",version_id:"GB-IMP-v2",effective_date:cutoff,receipt_id:"LOCAL-REC-02"});
    const due = new Date(time);
    due.setUTCDate(due.getUTCDate()+4);
    state.action = {id:"QMS-DEMO-001",status:"assigned",time,dueAt:due.toISOString(),batchIds:inScope.map(batch=>batch.id)};
    addEvent(state,"downstream_action.required","replay",time,{action_id:state.action.id,decision_id:"DEC-01",requirement_version_id:"GB-IMP-v2",owner:"quality_labeling",due_at:state.action.dueAt,batch_ids:state.action.batchIds,mock:true});
    return "Approved. Version 2 and the mock Quality task were recorded.";
  }
  addEvent(state,outcome === "rejected" ? "proposal.rejected" : "proposal.investigation_requested",role,time,decisionData);
  return outcome === "rejected" ? "Proposal rejected. Version 1 remains published." : "Investigation requested. Version 1 remains published.";
}
function acknowledge(state,role,time) {
  if (role !== "owner") return "Switch to Quality action owner to acknowledge.";
  if (!state.action) return "Approve the country record update to create a task.";
  if (state.action.status === "acknowledged") return "This task is already acknowledged.";
  state.action.status = "acknowledged";
  state.action.acknowledgedAt = time;
  addEvent(state,"downstream_action.acknowledged",role,time,{action_id:state.action.id,case_status:"open",implementation_status:"pending"});
  return "Task acknowledged. Implementation is pending and the case is open.";
}
function versionAt(state,date) {
  if (!date) return null;
  return state.decision?.outcome === "approved" && date >= cutoff ? 2 : 1;
}
</script>

  pin:'<path d="M12 6.5C12 9 8 13.5 8 13.5S4 9 4 6.5a4 4 0 0 1 8 0Z"/><circle cx="8" cy="6.5" r="1.2"/>',
  info:'<circle cx="8" cy="8" r="5.5"/><path d="M8 7.5v3m0-5h.01"/>',
  download:'<path d="M8 2.5V10m-3-3 3 3 3-3M3 11v2.5h10V11"/>',
  replay:'<path d="M3 7a5 5 0 1 1 1 4m-1-7v3.5h3.5"/>',
  external:'<path d="M9 3h4v4m0-4L7 9m0-5H3v9h9V9"/>'
};
function icon(name) {return '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true">'+paths[name]+'</svg>';}
const pages = [
  ["monitor","Regulatory monitor","Monitor"],["impact","Company impact","Assess"],
  ["review","SME review","Review"],["downstream","Downstream actions","Follow up"],
  ["workflow","Workflow map",""]
];
const handoffs = [
  ["Detect","RegChain AI","Replay a prepared comparison","Route material changes to assessment. Cosmetic changes stay in monitoring."],
  ["Assess","RegChain AI + Clinical Supply","Explain the impact on each batch","Surface missing data, boundary dates and out-of-scope records."],
  ["Decide","Regulatory SME","Review evidence and the country record delta","Approve, reject or request investigation with a rationale."],
  ["Publish","Country intelligence adapter","Record the approved version and receipt","Keep the predecessor in history. A failed publication stays open."],
  ["Assign and acknowledge","Quality action owner","Receive the scoped labeling review task","Record acknowledgement and track implementation separately."],
  ["Verify and close","Quality verifier","Review implementation evidence","Close after publication is reconciled and required work is verified. Prototype ends at acknowledgement."]
];
const storageKey = "regchain-ai-prototype-v1";
const byId = (id) => document.getElementById(id);
const html = (value) => String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
const pill = (label,tone="") => '<span class="pill '+tone+'"><span class="dot"></span>'+html(label)+'</span>';
function button(label,act,tone="",symbol="",value="",disabled=false) {
  return '<button type="button" class="btn '+tone+'" data-act="'+act+'" data-value="'+html(value)+'"'+(disabled?' disabled':'')+'>'+(symbol?icon(symbol):'')+html(label)+'</button>';
}
function goButton(label,page,tone="") {return button(label,"go",tone,"arrow",page);}
function dateLabel(date) {
  return date ? new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(date)) : "Missing";
}
function formatTime(time) {
  return time ? new Intl.DateTimeFormat("en-GB",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"UTC"}).format(new Date(time))+" UTC" : "Unassigned";
}
function loadState() {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey));
    if (value?.schema === 1 && Array.isArray(value.events)) return value;
  } catch {}
  return newState();
}
let state = loadState();
let page = "monitor";
let role = "reviewer";
let filter = "all";
let selectedBatch = "B-102";
let queryDate = "2026-05-05";
let selectedScenario = state.scenario;
const materialReady = () => state.scenario === "material" && state.events.length > 0;
const approved = () => state.decision?.outcome === "approved";
function save() {try {localStorage.setItem(storageKey,JSON.stringify(state));} catch {}}
function notify(message="") {byId("notice").textContent = message;}
function status() {
  if (!state.observation) return ["Ready to replay",""];
  if (state.scenario !== "material") return state.scenario === "cosmetic" ? ["No material change",""] : ["Outside UK scope",""];
  if (state.action?.status === "acknowledged") return ["Open · Implementation pending","warm"];
  if (approved()) return ["Published · Follow-up open","green"];
  if (state.decision?.outcome === "rejected") return ["Proposal rejected",""];
  if (state.decision?.outcome === "investigation") return ["Investigation requested","warm"];
  return ["Awaiting SME review","warm"];
}
function decisionStatus() {
  if (approved()) return ["Approved","green"];
  if (state.decision?.outcome === "rejected") return ["Rejected",""];
  if (state.decision?.outcome === "investigation") return ["Investigation requested","warm"];
  return ["SME decision",""];
}
function paintShell() {
  const [statusLabel,tone] = status();
  byId("breadcrumb").textContent=pages.find(item=>item[0]===page)[1];
  byId("persona").value=role;
  byId("navigation").innerHTML='<div class="nav-label">Change management</div>'+pages.map(([key,title])=>'<button class="nav-btn" type="button" data-act="go" data-value="'+key+'"'+(page===key?' aria-current="page"':'')+'>'+icon(key)+title+'</button>').join("");
  byId("case-header").innerHTML='<header class="case"><div class="case-context"><span class="mono">'+caseId+'</span><span aria-hidden="true">·</span><span>Historical replay</span></div><div class="case-main"><div><h1>UK clinical trial labeling</h1><p>Review a change to investigational medicinal product (IMP) labeling and trace its impact on batches.</p></div>'+pill(statusLabel,tone)+'</div><div class="case-meta"><span>'+icon("pin")+'United Kingdom</span><span>'+icon("calendar")+'Effective 28 Apr 2026</span><span>'+icon("document")+'Part 7 and Schedule 14</span></div></header>';
  const hints=[state.observation?"Replay recorded":"Prepared evidence",materialReady()?"6 batches assessed":"Awaiting replay",materialReady()?decisionStatus()[0]:"SME decision",materialReady()&&state.action?.status==="acknowledged"?"Acknowledged":materialReady()&&state.action?"Task assigned":"Quality handoff"];
  byId("progress").innerHTML=pages.slice(0,4).map(([key,title,short],index)=>'<button class="step" data-act="go" data-value="'+key+'" type="button"'+(page===key?' aria-current="step"':'')+'><span class="symbol">'+icon(key)+'</span><span><strong>'+short+'</strong><small>'+hints[index]+'</small></span></button>').join("");
}
function heading(title,subtitle,action="") {
  return '<div class="section-title"><div><h2 tabindex="-1" id="screen-title">'+title+'</h2><p>'+subtitle+'</p></div>'+action+'</div>';
}
function panel(title,description,body) {
  return '<section class="card"><div class="head"><div><h3>'+title+'</h3>'+(description?'<p class="small muted">'+description+'</p>':'')+'</div></div>'+body+'</section>';
}
function evidenceRows(ids) {
  return '<div class="evidence-list">'+ids.map(id=>{
    const item=evidence.find(entry=>entry.id===id);
    return '<button type="button" class="evidence-row" data-act="evidence" data-value="'+id+'">'+icon("document")+'<span><strong>'+item.title+'</strong><small>'+item.locator+'</small></span>'+icon("chevron")+'</button>';
  }).join("")+'</div>';
}
function comparison() {
  const candidateStatus=approved()?["Published","green"]:state.decision?decisionStatus():["Proposed","blue"];
  return '<div class="pair"><div class="current"><header>'+pill(approved()?"Previous version":"Published baseline")+'<strong>Version 1</strong></header><p>'+baseline+'</p></div><div class="proposed"><header>'+pill(...candidateStatus)+'<strong>Version 2</strong></header><p>'+candidate+'</p></div></div>';
}
function preReplay(title) {
  return panel(title,"Replay the official change to prepare the case.",'<div class="pad">'+goButton("Open regulatory monitor","monitor","primary")+'</div>');
}
function monitorScreen() {
  const choices=[["material","Official UK labeling change"],["cosmetic","Cosmetic page edit"],["outside","EU-only scope control"]];
  const controls='<label class="field"><span>Replay scenario</span><select id="scenario">'+choices.map(([key,title])=>'<option value="'+key+'"'+(key===selectedScenario?' selected':'')+'>'+title+'</option>').join("")+'</select></label>'+button("Replay scenario","replay","primary","replay");
  const replayCard='<section class="card pad"><h3>Source replay</h3><p class="small muted">Prepared comparison and official references.</p><div class="field-group" style="margin-top:11px">'+controls+'</div></section>';
  let result='<div class="context-band">'+icon("info")+'Run the official change to create a reviewable case and assess the fictional portfolio.</div>';
  if (state.observation && !materialReady()) {
    result='<div class="context-band">'+icon("info")+(state.scenario==="cosmetic"?"Cosmetic edit replayed. This run produced no proposal or downstream task.":"EU-only scope replayed. This run produced no UK proposal or downstream task.")+'</div>';
  }
  const sourceComparison='<div class="pair"><div class="current"><header>'+pill("Earlier edition")+'<strong>Regulation 46</strong></header><p>Earlier Part 7 referred to the labeling rules in Article 15, with specific exceptions.</p></div><div class="proposed"><header>'+pill("Amendment","green")+'<strong>Regulation 46 and Schedule 14</strong></header><p>Amended Part 7 sets out labeling requirements and a transitional provision preserves earlier rules for qualifying batches.</p></div></div>';
  if (materialReady()) result=panel("Source comparison","Prepared summary of the official before and after text",sourceComparison+'<div class="bottom"><span class="small muted">Instrument made 28 Apr 2025 · Effective 28 Apr 2026</span>'+goButton("View batch impact","impact","primary")+'</div>');
  return heading("Regulatory monitor","Replay a source change and inspect the evidence behind it.")+
    '<div class="split"><div class="stack">'+replayCard+result+'</div>'+panel("Source evidence","Official references used in the prepared case",evidenceRows(evidence.map(item=>item.id)))+'</div>';
}
function impactScreen() {
  const title=heading("Company impact","Inspect triage outcomes and the data used for each batch.",materialReady()?button("Export impact JSON","export-impact","","download"):"");
  if (!materialReady()) return title+preReplay("Portfolio assessment");
  const filters=[["all","All batches"],["in","UK scope"],["review","Needs review"],["excluded","Out of scope"]];
  const shown=findings.filter(batch=>filter==="all" || (filter==="in" ? batch.outcome!=="excluded" : batch.outcome===filter));
  const active=shown.find(batch=>batch.id===selectedBatch) || shown[0];
  selectedBatch=active.id;
  const rows=shown.map(batch=>'<tr><td><button type="button" class="quiet mono" aria-pressed="'+(batch.id===active.id)+'" data-act="batch" data-value="'+batch.id+'">'+batch.id+'</button><div class="small muted">'+batch.study+'</div></td><td>'+batch.country+'</td><td>'+dateLabel(batch.qp)+'</td><td>'+pill(...results[batch.outcome])+'</td></tr>').join("");
  const filtersHtml='<label class="field"><span>Show batches</span><select id="impact-filter">'+filters.map(([key,name])=>'<option value="'+key+'"'+(filter===key?' selected':'')+'>'+name+'</option>').join("")+'</select></label>';
  const table='<section class="card"><div class="head"><h3>Batch assessment</h3>'+filtersHtml+'</div><div class="table-wrap" tabindex="0"><table><caption>Fictional batch assessment</caption><thead><tr><th>Batch / study</th><th>Country</th><th>Finished IMP QP date</th><th>Outcome</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="bottom"><span class="small muted">Assessment ASMT-01 · Fictional portfolio</span>'+goButton("Review proposal","review","primary")+'</div></section>';
  const basis=[["Study",active.study],["Cohort",active.cohort],["Label specification",active.label],["Finished IMP QP",dateLabel(active.qp)]];
  if (active.physical) basis.push(["Physical manufacture",dateLabel(active.physical)]);
  const detail=panel(active.id+" · Assessment basis","",'<div class="pad">'+pill(...results[active.outcome])+'<p style="margin-top:9px">'+active.reason+'</p><ul class="basis">'+basis.map(([key,value])=>'<li><span>'+key+'</span><strong class="small">'+value+'</strong></li>').join("")+'</ul></div>'+evidenceRows(active.evidenceIds));
  const stats='<div class="card stats"><div class="stat"><strong>2</strong><span>UK studies</span></div><div class="stat"><strong>'+inScope.length+'</strong><span>UK-scope batches</span></div><div class="stat"><strong>'+findings.filter(item=>item.outcome==="excluded").length+'</strong><span>Out of scope</span></div></div>';
  return title+'<div class="split impact"><div class="stack">'+stats+table+'</div>'+detail+'</div>';
}
function reviewScreen() {
  const title=heading("SME review","Compare the proposed country record with its published baseline.");
  if (!materialReady()) return title+preReplay("Country record proposal");
  let decisionView='<div class="pad"><label class="field"><span>Review rationale</span><textarea id="rationale" placeholder="Record the basis for your decision."'+(role!=="reviewer"?' disabled':'')+'></textarea></label><p id="decision-error" class="small" role="alert"></p><div class="actions" style="margin-top:10px">'+button("Approve and publish","decision","primary","check","approved",role!=="reviewer")+button("Reject","decision","danger","","rejected",role!=="reviewer")+button("Request investigation","decision","","","investigation",role!=="reviewer")+'</div>'+(role!=="reviewer"?'<p class="small muted" style="margin-top:8px">Switch to Regulatory SME to record a decision.</p>':'')+'</div>';
  if (state.decision) {
    const [label,tone]=decisionStatus();
    decisionView='<div class="pad">'+pill(label,tone)+'<p style="margin-top:8px">'+html(state.decision.reason)+'</p><p class="small muted" style="margin-top:6px">Regulatory SME · '+formatTime(state.decision.time)+'</p>'+(approved()?'<div class="actions" style="margin-top:10px">'+goButton("View Quality task","downstream","primary")+'</div>':'')+'</div>';
  }
  const version=versionAt(state,queryDate);
  const versionRows=[["Version 1","Seeded baseline"],...(approved()?[["Version 2","Published · receipt LOCAL-REC-02"]]:[])];
  const history=panel("Country record history","GB / IMP labeling",'<div class="pad"><ul class="basis">'+versionRows.map(([key,value])=>'<li><span>'+key+'</span><strong class="small">'+value+'</strong></li>').join("")+'</ul><label class="field" style="margin-top:12px"><span>Ordinary cohort date</span><input type="date" id="version-date" value="'+html(queryDate)+'"></label><p class="small" id="version-result" style="margin-top:7px">'+(version?'Version '+version+' resolves for this date.':'Select a date.')+'</p></div>');
  const proposal=panel("Proposed country record update","PROP-01 · Revision 1 · GB / IMP labeling",comparison()+decisionView);
  return title+'<div class="split"><div class="stack">'+proposal+history+'</div><div class="stack">'+panel("Review evidence","Evidence attached to proposal revision 1",evidenceRows(["EV-01","EV-02","EV-03"]))+'<div class="context-band">'+icon("info")+'The decision applies to the country record. Batch outcomes remain review recommendations.</div></div></div>';
}
function timeline() {
  const entries=state.events.map(entry=>'<li>'+icon("check")+'<span><strong>'+labels[entry.type]+'</strong><small>'+roles[entry.actor]+' · '+formatTime(entry.occurred_at)+'</small></span></li>').join("");
  return entries?'<ol class="timeline">'+entries+'</ol>':'<p class="pad muted">Replay the official change to start the activity log.</p>';
}
function downstreamScreen() {
  const active = state.scenario === "material" ? state.action : null;
  const events = materialReady() ? button("Export events JSON","export-events","","download") : "";
  const title=heading("Downstream actions","Track the Quality handoff and its implementation status.",events);
  if (!materialReady()) return title+preReplay("Mock Quality handoff");
  const detail=active?'<div class="pad"><div class="actions">'+pill(active.status==="acknowledged"?"Acknowledged":"Assigned",active.status==="acknowledged"?"green":"blue")+pill("Implementation pending","warm")+'</div><ul class="basis"><li><span>Owner</span><strong>Quality & labeling</strong></li><li><span>Country record</span><strong>GB-IMP-v2</strong></li><li><span>Batch scope</span><strong>'+active.batchIds.join(", ")+'</strong></li><li><span>Due</span><strong>'+formatTime(active.dueAt)+'</strong></li><li><span>Case</span><strong>Open</strong></li></ul></div><div class="bottom"><span class="small muted">'+(active.status==="acknowledged"?"Acknowledged "+formatTime(active.acknowledgedAt):role==="owner"?"Record receipt of this mock task.":"Switch to Quality action owner to acknowledge.")+'</span>'+(active.status==="assigned"?button("Acknowledge task","ack","primary","check","",role!=="owner"):"")+'</div>':'<div class="pad"><p>The mock task is created after an approved country record is published.</p><div class="actions" style="margin-top:9px">'+goButton("Open SME review","review")+'</div></div>';
  return title+'<div class="split">'+panel(active?"Review labeling impact":"Mock Quality handoff",active?active.id+" · Simulated QMS task":"Awaiting country record approval",detail)+panel("Activity log",state.events.length+" recorded events",timeline())+'</div>';
}
function workflowScreen() {
  return heading("Workflow map","See who owns each step and what evidence moves the case forward.")+
    panel("Handoffs and gates","Select a stage to view its screen.",'<div class="table-wrap" tabindex="0"><table class="flow-table"><caption>Workflow owners and gates</caption><thead><tr><th>Stage</th><th>Owner</th><th>Output</th><th>Gate or next step</th></tr></thead><tbody>'+handoffs.map(([step,owner,output,gate],index)=>'<tr><td><button type="button" class="quiet" data-act="go" data-value="'+["monitor","impact","review","review","downstream","downstream"][index]+'">'+step+'</button></td><td>'+owner+'</td><td>'+output+'</td><td>'+gate+'</td></tr>').join("")+'</tbody></table></div>');
}
const screens={monitor:monitorScreen,impact:impactScreen,review:reviewScreen,downstream:downstreamScreen,workflow:workflowScreen};
function render() {paintShell();byId("screen").innerHTML=screens[page]();}
function navigate(to) {
  page=to;
  notify();
  render();
  byId("screen-title").focus({preventScroll:true});
  window.scrollTo(0,0);
}
function showEvidence(id) {
  const item=evidence.find(entry=>entry.id===id);
  byId("dialog-title").textContent=item.title;
  byId("dialog-body").innerHTML='<div class="small muted">'+item.kind+' · '+item.locator+'</div><p>'+item.summary+'</p><p class="small muted">Prepared summary for the demonstration</p><div class="actions"><a class="btn primary" href="'+item.url+'" target="_blank" rel="noopener noreferrer">'+icon("external")+'Open official source</a></div>';
  byId("detail").showModal();
}
function download(name,data) {
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const anchor=document.createElement("a");
  anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const actions = {
  go:navigate,
  reset:()=>{
    byId("dialog-title").textContent="Reset the demo?";
    byId("dialog-body").innerHTML='<p>Clear the local replay, decision and task history and return to the prepared example.</p><div class="actions">'+button("Reset demo","confirm-reset","danger")+'</div>';
    byId("detail").showModal();
  },
  "confirm-reset":()=>{
    byId("detail").close();state=newState();role="reviewer";selectedScenario="material";filter="all";selectedBatch="B-102";queryDate="2026-05-05";save();navigate("monitor");notify("Demo reset.");
  },
  replay:()=>{
    replay(state,selectedScenario,new Date().toISOString());save();render();
    const target=materialReady()?byId("screen").querySelector('[data-value="impact"]'):byId("scenario");
    target.focus();notify(materialReady()?"Official UK case ready for review.":"Replay complete.");
  },
  batch:(id)=>{selectedBatch=id;render();byId("screen").querySelector('[data-act="batch"][data-value="'+id+'"]').focus();},
  evidence:showEvidence,
  decision:(outcome)=>{
    const rationale=byId("rationale");
    if (!rationale.value.trim()) {byId("decision-error").textContent="Enter the review rationale.";rationale.focus();return;}
    const message=decide(state,role,outcome,rationale.value,new Date().toISOString());
    save();render();byId("screen-title").focus();notify(message);
  },
  ack:()=>{const message=acknowledge(state,role,new Date().toISOString());save();render();byId("screen-title").focus();notify(message);},
  "export-impact":()=>download("regchain-impact-RC-UK-001.json",{case_id:caseId,assessment_id:"ASMT-01",proposal_id:"PROP-01",proposal_revision:1,effective_date:cutoff,synthetic_portfolio:true,findings,evidence}),
  "export-events":()=>download("regchain-events-RC-UK-001.json",state.events)
};
document.addEventListener("click", event => {
  const control=event.target.closest("[data-act]");
  if (control && !control.disabled) actions[control.dataset.act](control.dataset.value);
});
document.addEventListener("change", event => {
  const {id,value}=event.target;
  if (id==="persona") {role=value;render();notify("Demo role changed to "+roles[role]+".");}
  if (id==="scenario") selectedScenario=value;
  if (id==="impact-filter") {filter=value;render();byId("impact-filter").focus();}
  if (id==="version-date") {queryDate=value;const version=versionAt(state,value);byId("version-result").textContent=version?"Version "+version+" resolves for this date.":"Select a date.";}
});
render();
</script>
